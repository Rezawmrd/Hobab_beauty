<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOBAB BEAUTY | مدیریت</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Vazirmatn',sans-serif;
    background:#fff8f6;
    color:#432f34;
    min-height:100vh;
}

/* =========================
   LOGIN
========================= */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top right,rgba(183,123,127,.16),transparent 35%),
        #fff8f6;
}

.login-box{
    width:100%;
    max-width:400px;
    padding:32px 24px;
    border-radius:28px;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(79,108,84,.25);
    box-shadow:0 20px 60px rgba(85,55,60,.12);
    backdrop-filter:blur(18px);
    text-align:center;
}

.login-logo{
    width:95px;
    height:95px;
    object-fit:contain;
    margin-bottom:15px;
}

.login-box h1{
    font-size:22px;
    margin-bottom:7px;
}

.login-box p{
    font-size:13px;
    color:#856f74;
    margin-bottom:25px;
}

.login-input{
    width:100%;
    height:48px;
    border:1px solid #e4d5d7;
    border-radius:14px;
    padding:0 15px;
    margin-bottom:12px;
    font-family:inherit;
    outline:none;
    background:#fff;
    color:#432f34;
}

.login-input:focus{
    border-color:#b77b7f;
}

.login-button{
    width:100%;
    height:48px;
    border:0;
    border-radius:14px;
    background:#4f6c54;
    color:#fff;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
}

.login-error{
    color:#b32626;
    font-size:13px;
    margin-top:12px;
    display:none;
}

/* =========================
   ADMIN
========================= */

.admin-app{
    display:none;
    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(255,248,246,.92);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(79,108,84,.16);
}

.topbar-inner{
    max-width:1200px;
    margin:auto;
    min-height:72px;
    padding:12px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#4f6c54;
}

.brand h1{
    font-size:18px;
}

.brand span{
    display:block;
    font-size:11px;
    color:#917b80;
    margin-top:2px;
}

.logout-button{
    border:1px solid #dfcbce;
    background:#fff;
    color:#765c62;
    border-radius:12px;
    padding:9px 14px;
    font-family:inherit;
    cursor:pointer;
}

/* =========================
   MAIN
========================= */

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:20px 15px 50px;
}

/* =========================
   NEW BOOKING ALERT
========================= */

.new-booking-alert{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:14px 17px;
    margin-bottom:18px;
    border-radius:18px;
    background:rgba(255,255,255,.9);
    border:1.5px solid rgba(190,42,42,.25);
    box-shadow:0 8px 25px rgba(150,50,50,.08);
}

.new-booking-alert.show{
    display:flex;
}

.alert-right{
    display:flex;
    align-items:center;
    gap:11px;
}

.alert-dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#e53935;
    box-shadow:0 0 0 5px rgba(229,57,53,.12);
    animation:pulseRed 1.5s infinite;
    flex-shrink:0;
}

@keyframes pulseRed{
    0%,100%{
        box-shadow:0 0 0 4px rgba(229,57,53,.10);
    }

    50%{
        box-shadow:0 0 0 8px rgba(229,57,53,.20);
    }
}

.alert-title{
    font-weight:700;
    font-size:14px;
}

.alert-count{
    color:#b32626;
    font-size:12px;
    margin-top:2px;
}

.alert-button{
    border:0;
    background:#b32626;
    color:#fff;
    border-radius:11px;
    padding:8px 13px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat-card{
    background:rgba(255,255,255,.78);
    border:1px solid rgba(79,108,84,.16);
    border-radius:20px;
    padding:18px;
}

.stat-label{
    font-size:12px;
    color:#8c777c;
    margin-bottom:7px;
}

.stat-number{
    font-size:25px;
    font-weight:800;
    color:#4f6c54;
}

/* =========================
   FILTERS
========================= */

.filter-box{
    background:rgba(255,255,255,.76);
    border:1px solid rgba(79,108,84,.16);
    border-radius:22px;
    padding:15px;
    margin-bottom:20px;
}

.filter-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
}

.filter-button{
    border:1px solid #ddced0;
    background:#fff;
    color:#705a60;
    border-radius:12px;
    padding:9px 13px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
}

.filter-button.active{
    background:#4f6c54;
    color:#fff;
    border-color:#4f6c54;
}

/* =========================
   SERVICE TABS
========================= */

.service-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:3px 1px 12px;
    margin-bottom:4px;
}

.service-tab{
    position:relative;
    border:1.5px solid rgba(79,108,84,.35);
    background:rgba(255,255,255,.75);
    color:#5d494e;
    border-radius:14px;
    padding:10px 16px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
    transition:.2s;
}

.service-tab.active{
    background:#4f6c54;
    color:#fff;
    border-color:#4f6c54;
}

.service-tab.has-new{
    border-color:#e53935;
}

.new-badge{
    position:absolute;
    top:-7px;
    left:-7px;
    min-width:21px;
    height:21px;
    padding:0 5px;
    border-radius:50px;
    background:#e53935;
    color:#fff;
    border:2px solid #fff8f6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:800;
    box-shadow:0 2px 8px rgba(229,57,53,.25);
    animation:badgePulse 1.5s infinite;
}

@keyframes badgePulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}

/* =========================
   DATE GROUP
========================= */

.date-group{
    margin-bottom:20px;
}

.date-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:15px;
    font-weight:800;
    color:#4f6c54;
}

.date-line{
    flex:1;
    height:1px;
    background:rgba(79,108,84,.16);
}

/* =========================
   APPOINTMENT CARD
========================= */

.appointment-card{
    background:rgba(255,255,255,.88);
    border:1px solid rgba(79,108,84,.15);
    border-radius:20px;
    padding:16px;
    margin-bottom:11px;
    box-shadow:0 7px 25px rgba(78,54,59,.055);
    position:relative;
    overflow:hidden;
}

.appointment-card.is-new{
    border-right:4px solid #e53935;
}

.new-label{
    display:inline-flex;
    align-items:center;
    gap:5px;
    color:#b32626;
    font-size:11px;
    font-weight:700;
    margin-bottom:7px;
}

.new-label::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:#e53935;
}

.card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.customer-name{
    font-size:16px;
    font-weight:800;
}

.customer-phone{
    font-size:12px;
    color:#806c72;
    margin-top:4px;
    direction:ltr;
    text-align:right;
}

.service-name{
    display:inline-block;
    margin-top:9px;
    padding:5px 9px;
    border-radius:9px;
    background:#fff3f1;
    color:#9c646a;
    font-size:11px;
}

.card-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-top:13px;
}

.info-item{
    background:#fffaf9;
    border-radius:11px;
    padding:9px 10px;
}

.info-label{
    display:block;
    font-size:10px;
    color:#a18b90;
    margin-bottom:3px;
}

.info-value{
    font-size:12px;
    font-weight:600;
}

.confirmed-box{
    margin-top:12px;
    padding:11px 12px;
    border-radius:13px;
    background:rgba(79,108,84,.08);
    border:1px solid rgba(79,108,84,.20);
}

.confirmed-title{
    color:#4f6c54;
    font-size:11px;
    font-weight:700;
}

.confirmed-time{
    color:#4f6c54;
    font-size:20px;
    font-weight:800;
    margin-top:2px;
    direction:ltr;
    text-align:right;
}

.description{
    margin-top:12px;
    padding:11px 12px;
    background:#fffaf9;
    border-radius:12px;
    font-size:12px;
    line-height:1.9;
    color:#69555a;
}

.card-actions{
    display:flex;
    gap:7px;
    margin-top:13px;
}

.action-button{
    flex:1;
    min-height:40px;
    border-radius:11px;
    border:1px solid #dfced1;
    background:#fff;
    font-family:inherit;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
}

.call-button{
    color:#4f6c54;
    border-color:rgba(79,108,84,.30);
}

.confirm-button{
    color:#4f6c54;
    border-color:rgba(79,108,84,.40);
    background:rgba(79,108,84,.06);
}

.delete-button{
    color:#b32626;
    border-color:rgba(179,38,38,.20);
}

/* =========================
   EMPTY
========================= */

.empty-state{
    text-align:center;
    padding:45px 20px;
    color:#927d82;
    background:rgba(255,255,255,.55);
    border-radius:20px;
    border:1px dashed #decfd1;
}

.empty-state strong{
    display:block;
    color:#68545a;
    margin-bottom:5px;
}

/* =========================
   MODALS
========================= */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(50,35,39,.48);
    backdrop-filter:blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:430px;
    background:#fffaf9;
    border-radius:26px;
    padding:22px;
    box-shadow:0 25px 70px rgba(0,0,0,.18);
    max-height:90vh;
    overflow-y:auto;
}

.modal h2{
    font-size:18px;
    margin-bottom:7px;
}

.modal-subtitle{
    font-size:12px;
    color:#8c777c;
    margin-bottom:20px;
}

/* =========================
   TIME PICKER
========================= */

.time-picker{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:13px;
    direction:ltr;
    margin:5px 0 15px;
}

.time-column{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.time-label{
    font-size:11px;
    color:#927c82;
    margin-bottom:6px;
}

.wheel-wrapper{
    width:105px;
    height:155px;
    position:relative;
    overflow:hidden;
    border-radius:18px;
    background:#fff;
    border:1px solid #e4d5d7;
}

.time-wheel{
    width:100%;
    height:100%;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
    padding:52px 0;
    direction:ltr;
}

.time-wheel::-webkit-scrollbar{
    display:none;
}

.time-option{
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    scroll-snap-align:center;
    font-size:21px;
    font-weight:500;
    color:#b8a5aa;
    transition:.15s;
    cursor:pointer;
    user-select:none;
}

.time-option.selected{
    color:#4f6c54;
    font-weight:800;
}

.wheel-selected{
    pointer-events:none;
    position:absolute;
    left:7px;
    right:7px;
    top:52px;
    height:50px;
    border-top:1px solid rgba(79,108,84,.25);
    border-bottom:1px solid rgba(79,108,84,.25);
    border-radius:10px;
}

.wheel-fade{
    pointer-events:none;
    position:absolute;
    left:0;
    right:0;
    height:52px;
    z-index:2;
}

.wheel-fade.top{
    top:0;
    background:linear-gradient(to bottom,#fff 15%,rgba(255,255,255,0));
}

.wheel-fade.bottom{
    bottom:0;
    background:linear-gradient(to top,#fff 15%,rgba(255,255,255,0));
}

.time-colon{
    font-size:25px;
    font-weight:800;
    color:#4f6c54;
    margin-top:20px;
}

.selected-time-box{
    text-align:center;
    padding:12px;
    background:rgba(79,108,84,.07);
    border:1px solid rgba(79,108,84,.18);
    border-radius:15px;
    margin-bottom:17px;
}

.selected-time-box span{
    display:block;
    font-size:10px;
    color:#8b777c;
    margin-bottom:2px;
}

.selected-time-box strong{
    font-size:23px;
    color:#4f6c54;
    direction:ltr;
    display:block;
}

/* =========================
   MODAL BUTTONS
========================= */

.modal-actions{
    display:flex;
    gap:9px;
}

.modal-button{
    flex:1;
    height:45px;
    border-radius:13px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
}

.modal-cancel{
    background:#fff;
    color:#725d62;
    border:1px solid #dfced1;
}

.modal-confirm{
    background:#4f6c54;
    color:#fff;
    border:1px solid #4f6c54;
}

.modal-delete{
    background:#b32626;
    color:#fff;
    border:0;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translate(-50%,120px);
    z-index:300;
    background:#432f34;
    color:#fff;
    padding:12px 18px;
    border-radius:13px;
    font-size:12px;
    opacity:0;
    transition:.3s;
    pointer-events:none;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){

    .topbar-inner{
        min-height:65px;
    }

    .brand h1{
        font-size:16px;
    }

    .stats{
        grid-template-columns:repeat(3,1fr);
        gap:7px;
    }

    .stat-card{
        padding:13px 9px;
    }

    .stat-label{
        font-size:10px;
    }

    .stat-number{
        font-size:20px;
    }

    .card-info{
        grid-template-columns:1fr 1fr;
    }

    .card-actions{
        flex-wrap:wrap;
    }

    .action-button{
        min-width:calc(50% - 4px);
    }

    .new-booking-alert{
        align-items:flex-start;
    }

    .alert-button{
        padding:7px 10px;
        font-size:10px;
    }

}

</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div class="login-screen" id="loginScreen">

    <div class="login-box">

        <img
            src="HOBAB_logo_cropped.png"
            class="login-logo"
            alt="HOBAB BEAUTY"
        >

        <h1>HOBAB BEAUTY</h1>

        <p>پنل مدیریت رزروها</p>

        <input
            type="email"
            id="loginEmail"
            class="login-input"
            placeholder="ایمیل"
            autocomplete="email"
        >

        <input
            type="password"
            id="loginPassword"
            class="login-input"
            placeholder="رمز عبور"
            autocomplete="current-password"
        >

        <button
            class="login-button"
            id="loginButton"
        >
            ورود به پنل
        </button>

        <div
            class="login-error"
            id="loginError"
        >
            ایمیل یا رمز عبور صحیح نیست.
        </div>

    </div>

</div>


<!-- =========================
     ADMIN APP
========================= -->

<div class="admin-app" id="adminApp">

    <header class="topbar">

        <div class="topbar-inner">

            <div class="brand">

                <div class="brand-dot"></div>

                <div>
                    <h1>HOBAB BEAUTY</h1>
                    <span>مدیریت رزروها</span>
                </div>

            </div>

            <button
                class="logout-button"
                id="logoutButton"
            >
                خروج
            </button>

        </div>

    </header>


    <main class="container">


        <!-- =========================
             NEW BOOKING ALERT
        ========================= -->

        <div
            class="new-booking-alert"
            id="newBookingAlert"
        >

            <div class="alert-right">

                <div class="alert-dot"></div>

                <div>

                    <div class="alert-title">
                        رزرو جدید دارید
                    </div>

                    <div
                        class="alert-count"
                        id="alertCount"
                    >
                        ۰ رزرو جدید
                    </div>

                </div>

            </div>

            <button
                class="alert-button"
                id="alertButton"
            >
                مشاهده
            </button>

        </div>


        <!-- =========================
             STATS
        ========================= -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-label">
                    کل رزروها
                </div>

                <div
                    class="stat-number"
                    id="totalCount"
                >
                    ۰
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    در انتظار تأیید
                </div>

                <div
                    class="stat-number"
                    id="pendingCount"
                >
                    ۰
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    تأیید شده
                </div>

                <div
                    class="stat-number"
                    id="confirmedCount"
                >
                    ۰
                </div>

            </div>

        </div>


        <!-- =========================
             FILTERS
        ========================= -->

        <div class="filter-box">

            <div class="filter-row">

                <button
                    class="filter-button active"
                    data-status="all"
                >
                    همه
                </button>

                <button
                    class="filter-button"
                    data-status="pending"
                >
                    در انتظار تأیید
                </button>

                <button
                    class="filter-button"
                    data-status="confirmed"
                >
                    تأیید شده
                </button>

            </div>

        </div>


        <!-- =========================
             SERVICE TABS
        ========================= -->

        <div
            class="service-tabs"
            id="serviceTabs"
        >

            <button
                class="service-tab active"
                data-service="all"
            >
                همه
            </button>

            <button
                class="service-tab"
                data-service="hair"
            >
                مو
            </button>

            <button
                class="service-tab"
                data-service="makeup"
            >
                میکاپ
            </button>

            <button
                class="service-tab"
                data-service="nail"
            >
                ناخن
            </button>

            <button
                class="service-tab"
                data-service="lash"
            >
                مژه
            </button>

            <button
                class="service-tab"
                data-service="brow"
            >
                ابرو
            </button>

            <button
                class="service-tab"
                data-service="skin"
            >
                پوست
            </button>

            <button
                class="service-tab"
                data-service="bridal"
            >
                عروس
            </button>

        </div>


        <!-- =========================
             APPOINTMENTS
        ========================= -->

        <div id="appointmentsContainer"></div>

    </main>

</div>


<!-- =========================
     CONFIRM TIME MODAL
========================= -->

<div
    class="modal-overlay"
    id="confirmModal"
>

    <div class="modal">

        <h2 id="confirmModalTitle">
            تأیید نوبت
        </h2>

        <div class="modal-subtitle">
            ساعت دقیق نوبت را انتخاب کنید.
        </div>


        <div class="time-picker">

            <div class="time-column">

                <div class="time-label">
                    ساعت
                </div>

                <div class="wheel-wrapper">

                    <div class="wheel-fade top"></div>

                    <div
                        class="time-wheel"
                        id="hourWheel"
                    ></div>

                    <div class="wheel-fade bottom"></div>

                    <div class="wheel-selected"></div>

                </div>

            </div>

/* =========================================================
   TIME WHEEL
========================================================= */

function buildTimeWheels(){

    hourWheel.innerHTML = "";

    minuteWheel.innerHTML = "";


    for(
        let hour = 8;
        hour <= 20;
        hour++
    ){

        const value =
            String(hour).padStart(
                2,
                "0"
            );


        const option =
            document.createElement(
                "div"
            );


        option.className =
            "time-option";


        option.dataset.value =
            value;


        option.textContent =
            value;


        hourWheel.appendChild(
            option
        );

    }


    ["00","30"].forEach(
        function(minute){

            const option =
                document.createElement(
                    "div"
                );


            option.className =
                "time-option";


            option.dataset.value =
                minute;


            option.textContent =
                minute;


            minuteWheel.appendChild(
                option
            );

        }
    );


    setupWheel(
        hourWheel,
        "hour"
    );


    setupWheel(
        minuteWheel,
        "minute"
    );

}


function setupWheel(
    wheel,
    type
){

    wheel.addEventListener(
        "scroll",
        function(){

            updateWheelSelection(
                wheel
            );

            updateSelectedTime();

        }
    );


    wheel.addEventListener(
        "click",
        function(e){

            const option =
                e.target.closest(
                    ".time-option"
                );


            if(!option){

                return;

            }


            const target =
                option.offsetTop -
                52;


            wheel.scrollTo({

                top:target,

                behavior:"smooth"

            });

        }
    );


    let scrollTimer;


    wheel.addEventListener(
        "scroll",
        function(){

            clearTimeout(
                scrollTimer
            );


            scrollTimer =
                setTimeout(
                    function(){

                        snapWheel(
                            wheel
                        );

                    },
                    100
                );

        }
    );

}


function snapWheel(wheel){

    const center =
        wheel.scrollTop + 77;


    let closest = null;

    let distance = Infinity;


    wheel
        .querySelectorAll(
            ".time-option"
        )
        .forEach(function(option){

            const optionCenter =
                option.offsetTop +
                option.offsetHeight / 2;


            const d =
                Math.abs(
                    optionCenter -
                    center
                );


            if(d < distance){

                distance = d;

                closest = option;

            }

        });


    if(closest){

        const target =
            closest.offsetTop -
            52;


        wheel.scrollTo({

            top:target,

            behavior:"smooth"

        });

    }

}


function updateWheelSelection(
    wheel
){

    const center =
        wheel.scrollTop + 77;


    let closest = null;

    let distance = Infinity;


    wheel
        .querySelectorAll(
            ".time-option"
        )
        .forEach(function(option){

            const optionCenter =
                option.offsetTop +
                option.offsetHeight / 2;


            const d =
                Math.abs(
                    optionCenter -
                    center
                );


            option.classList.remove(
                "selected"
            );


            if(d < distance){

                distance = d;

                closest = option;

            }

        });


    if(closest){

        closest.classList.add(
            "selected"
        );

    }

}


function getCenterValue(wheel){

    const center =
        wheel.scrollTop + 77;


    let closest = null;

    let distance = Infinity;


    wheel
        .querySelectorAll(
            ".time-option"
        )
        .forEach(function(option){

            const optionCenter =
                option.offsetTop +
                option.offsetHeight / 2;


            const d =
                Math.abs(
                    optionCenter -
                    center
                );


            if(d < distance){

                distance = d;

                closest = option;

            }

        });


    return closest
        ? closest.dataset.value
        : null;

}


function updateSelectedTime(){

    const hour =
        getCenterValue(
            hourWheel
        );


    const minute =
        getCenterValue(
            minuteWheel
        );


    if(hour){

        selectedHour =
            hour;

    }


    if(minute){

        selectedMinute =
            minute;

    }


    selectedTimePreview.textContent =
        `${selectedHour}:${selectedMinute}`;

}


function initializeTimePicker(
    currentTime
){

    let hour =
        "09";

    let minute =
        "00";


    if(currentTime){

        const parts =
            String(
                currentTime
            ).split(":");


        if(parts.length === 2){

            hour =
                parts[0];

            minute =
                parts[1];

        }

    }


    if(
        minute !== "00" &&
        minute !== "30"
    ){

        const numeric =
            parseInt(
                minute,
                10
            );


        minute =
            numeric < 15
                ? "00"
                : numeric < 45
                    ? "30"
                    : "00";


        if(
            numeric >= 45
        ){

            let h =
                parseInt(
                    hour,
                    10
                );


            h += 1;


            hour =
                String(h).padStart(
                    2,
                    "0"
                );

        }

    }


    selectedHour =
        hour;


    selectedMinute =
        minute;


    const hourOption =
        hourWheel.querySelector(
            `[data-value="${hour}"]`
        );


    const minuteOption =
        minuteWheel.querySelector(
            `[data-value="${minute}"]`
        );


    if(hourOption){

        hourWheel.scrollTop =
            hourOption.offsetTop -
            52;

    }


    if(minuteOption){

        minuteWheel.scrollTop =
            minuteOption.offsetTop -
            52;

    }


    updateWheelSelection(
        hourWheel
    );


    updateWheelSelection(
        minuteWheel
    );


    updateSelectedTime();

}

   OPEN CONFIRM MODAL

function openConfirmModal(id){

    const item =

    if(!item){

        return;

    }


    selectedAppointment =
        item;


    if(item.confirmed){

        confirmModalTitle.textContent =
            "ویرایش ساعت نوبت";

        modalConfirm.textContent =
            "ذخیره ساعت جدید";

    }else{

        confirmModalTitle.textContent =
            "تأیید نوبت";

        modalConfirm.textContent =
            "تأیید نوبت";

    }


    initializeTimePicker(
        item.confirmed_time
    );


    confirmModal.classList.add(
        "show"
    );

}


/* =========================================================
   CLOSE CONFIRM
========================================================= */

document
    .getElementById("confirmCancel")
    .addEventListener(
        "click",
        function(){

            confirmModal.classList.remove(
                "show"
            );

        }
    );


confirmModal.addEventListener(
    "click",

            confirmModal
        ){

            confirmModal.classList.remove(

            );

        }

/* =========================================================
   SAVE CONFIRM TIME
========================================================= */

modalConfirm.addEventListener(
    "click",
    async function(){

        if(!selectedAppointment){

            return;

        }


        updateSelectedTime();


        const time =
            `${selectedHour}:${selectedMinute}`;


        modalConfirm.disabled =
            true;

        modalConfirm.textContent =
            "در حال ذخیره...";


        const {
            error
        } =
        await supabaseClient
            .from("appointments")
            .update({

                confirmed:true,

                confirmed_time:time

            })
            .eq(
                "id",
                selectedAppointment.id
            );


        modalConfirm.disabled =
            false;


        if(error){

            console.error(error);

            showToast(
                "خطا در ذخیره ساعت نوبت"
            );

            modalConfirm.textContent =
                selectedAppointment.confirmed
                    ? "ذخیره ساعت جدید"
                    : "تأیید نوبت";

            return;

        }


        confirmModal.classList.remove(
            "show"
        );


        showToast(
            "نوبت با موفقیت تأیید شد"
        );


        selectedAppointment =
            null;


        await loadAppointments();

    }
);

deleteModal.addEventListener(

/* =========================================================
   DELETE APPOINTMENT
========================================================= */

document
    .getElementById("deleteConfirm")
    .addEventListener(

            }


            const button =

                );

            deleteModal.classList.remove(

/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(date){

    if(!date){

        return "بدون تاریخ";

    }


    return toPersianNumber(
        String(date)
    );

}


/* =========================================================
   PERSIAN NUMBERS
========================================================= */

function toPersianNumber(value){

    return String(value)
        .replace(/0/g,"۰")
        .replace(/1/g,"۱")
        .replace(/2/g,"۲")
        .replace(/3/g,"۳")
        .replace(/4/g,"۴")
        .replace(/5/g,"۵")
        .replace(/6/g,"۶")
        .replace(/7/g,"۷")
        .replace(/8/g,"۸")
        .replace(/9/g,"۹");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   NOTIFICATION PERMISSION
========================================================= */

function requestNotificationPermission(){

    try{

        if(
            "Notification" in window &&
            Notification.permission ===
            "default"
        ){

            Notification.requestPermission();

        }

    }catch(e){}

}

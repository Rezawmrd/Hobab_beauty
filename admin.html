<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOBAB BEAUTY | مدیریت رزروها</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Tahoma, Arial, sans-serif;
    background:
        radial-gradient(circle at top right, rgba(183,123,127,.10), transparent 35%),
        #fff8f6;
    color:#4b3035;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   LOGIN
========================= */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:410px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(18px);
    border:1px solid rgba(79,108,84,.35);
    border-radius:24px;
    padding:30px 24px;
    box-shadow:0 18px 55px rgba(75,48,53,.12);
}

.login-logo{
    text-align:center;
    margin-bottom:22px;
}

.login-logo strong{
    display:block;
    font-size:28px;
    letter-spacing:3px;
    color:#8e5e63;
}

.login-logo span{
    display:block;
    margin-top:5px;
    font-size:12px;
    letter-spacing:4px;
    color:#8d7a7d;
}

.login-box h2{
    text-align:center;
    margin:0 0 25px;
    font-size:20px;
}

.login-input{
    width:100%;
    border:1px solid rgba(79,108,84,.28);
    background:#fff;
    border-radius:13px;
    padding:14px;
    margin-bottom:12px;
    outline:none;
    color:#4b3035;
    font-size:14px;
}

.login-input:focus{
    border-color:#4f6c54;
}

.login-button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    background:#4f6c54;
    color:white;
    font-size:15px;
    font-weight:bold;
}

.login-error{
    color:#b44b56;
    font-size:13px;
    text-align:center;
    margin-top:12px;
    min-height:18px;
}

/* =========================
   DASHBOARD
========================= */

.dashboard{
    display:none;
    max-width:1200px;
    margin:auto;
    padding:20px 15px 50px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
}

.brand h1{
    margin:0;
    font-size:24px;
    letter-spacing:2px;
    color:#8e5e63;
}

.brand p{
    margin:5px 0 0;
    color:#8d7a7d;
    font-size:12px;
}

.logout{
    border:1px solid rgba(183,123,127,.45);
    background:white;
    color:#8e5e63;
    padding:9px 14px;
    border-radius:11px;
    font-size:13px;
}

/* =========================
   NEW BOOKING ALERT
========================= */

.new-alert{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:#fff;
    border:2px solid #b44b56;
    border-radius:16px;
    padding:13px 15px;
    margin-bottom:15px;
    box-shadow:0 7px 25px rgba(180,75,86,.12);
}

.new-alert.show{
    display:flex;
}

.new-alert-text{
    display:flex;
    align-items:center;
    gap:9px;
    font-weight:bold;
    color:#9e3e49;
}

.alert-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#b44b56;
    box-shadow:0 0 0 5px rgba(180,75,86,.12);
}

.new-alert button{
    border:0;
    background:#b44b56;
    color:white;
    border-radius:10px;
    padding:9px 13px;
    font-size:12px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    background:rgba(255,255,255,.75);
    border:1px solid rgba(79,108,84,.22);
    border-radius:16px;
    padding:15px;
    text-align:center;
}

.stat-number{
    font-size:25px;
    font-weight:bold;
    color:#8e5e63;
}

.stat-label{
    font-size:12px;
    color:#806e71;
    margin-top:5px;
}

/* =========================
   DAY FILTER
========================= */

.section-title{
    font-size:14px;
    font-weight:bold;
    margin:0 0 10px;
}

.day-scroller{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:3px 2px 10px;
    margin-bottom:15px;
    scrollbar-width:none;
}

.day-scroller::-webkit-scrollbar{
    display:none;
}

.day-button{
    flex:0 0 auto;
    border:1px solid rgba(79,108,84,.28);
    background:#fff;
    color:#5e4a4d;
    border-radius:12px;
    padding:10px 14px;
    min-width:82px;
    font-size:12px;
    transition:.2s;
}

.day-button small{
    display:block;
    margin-top:4px;
    color:#9a888a;
    font-size:10px;
}

.day-button.active{
    background:#4f6c54;
    border-color:#4f6c54;
    color:white;
}

.day-button.active small{
    color:rgba(255,255,255,.8);
}

.day-button.today{
    border-color:#b77b7f;
}

/* =========================
   STATUS FILTER
========================= */

.status-filter{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    margin-bottom:14px;
}

.status-filter::-webkit-scrollbar{
    display:none;
}

.status-button{
    flex:0 0 auto;
    border:1px solid rgba(183,123,127,.28);
    background:white;
    color:#6f5c60;
    padding:9px 14px;
    border-radius:10px;
    font-size:12px;
}

.status-button.active{
    background:#b77b7f;
    color:white;
    border-color:#b77b7f;
}

/* =========================
   SERVICE TABS
========================= */

.service-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:8px;
    margin-bottom:18px;
}

.service-tabs::-webkit-scrollbar{
    display:none;
}

.service-tab{
    position:relative;
    flex:0 0 auto;
    border:1px solid rgba(79,108,84,.28);
    background:#fff;
    color:#5e4a4d;
    border-radius:11px;
    padding:10px 15px;
    font-size:12px;
}

.service-tab.active{
    background:#4f6c54;
    border-color:#4f6c54;
    color:white;
}

.service-badge{
    display:none;
    position:absolute;
    top:-6px;
    left:-6px;
    min-width:19px;
    height:19px;
    border-radius:50%;
    background:#b44b56;
    color:#fff;
    font-size:10px;
    line-height:19px;
    text-align:center;
    font-weight:bold;
    border:2px solid #fff8f6;
}

.service-badge.show{
    display:block;
}

/* =========================
   DATE GROUP
========================= */

.date-group{
    margin-bottom:22px;
}

.date-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:rgba(79,108,84,.07);
    border-right:3px solid #4f6c54;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
}

.date-title-main{
    font-weight:bold;
    font-size:14px;
    color:#4f6c54;
}

.date-count{
    background:white;
    border:1px solid rgba(79,108,84,.18);
    border-radius:20px;
    padding:4px 9px;
    font-size:10px;
    color:#6d5b5f;
}

/* =========================
   APPOINTMENT CARD
========================= */

.appointment-card{
    background:rgba(255,255,255,.82);
    border:1px solid rgba(79,108,84,.18);
    border-right:3px solid #b77b7f;
    border-radius:16px;
    padding:15px;
    margin-bottom:10px;
    box-shadow:0 5px 20px rgba(75,48,53,.05);
}

.appointment-card.new{
    border-right-color:#b44b56;
    box-shadow:0 5px 20px rgba(180,75,86,.10);
}

.card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
}

.customer-name{
    font-size:16px;
    font-weight:bold;
    color:#4b3035;
}

.service-name{
    font-size:12px;
    color:#8e5e63;
    margin-top:5px;
}

.new-label{
    display:none;
    font-size:10px;
    background:#b44b56;
    color:white;
    border-radius:20px;
    padding:4px 8px;
    white-space:nowrap;
}

.appointment-card.new .new-label{
    display:inline-block;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-top:13px;
}

.info-item{
    background:#fffaf9;
    border:1px solid rgba(183,123,127,.13);
    border-radius:10px;
    padding:9px;
}

.info-label{
    font-size:9px;
    color:#9b898c;
    margin-bottom:4px;
}

.info-value{
    font-size:12px;
    color:#554144;
    word-break:break-word;
}

.status-line{
    margin-top:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.status-text{
    font-size:11px;
}

.status-pending{
    color:#b44b56;
}

.status-confirmed{
    color:#4f6c54;
    font-weight:bold;
}

.confirmed-time{
    font-size:12px;
    color:#4f6c54;
    font-weight:bold;
}

/* =========================
   ACTIONS
========================= */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    margin-top:13px;
}

.action-button{
    border:0;
    border-radius:10px;
    padding:10px 6px;
    font-size:11px;
}

.call-button{
    background:#eef5ef;
    color:#4f6c54;
}

.confirm-button{
    background:#b77b7f;
    color:white;
}

.delete-button{
    background:#f7e9e9;
    color:#a44852;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    background:rgba(255,255,255,.7);
    border:1px dashed rgba(79,108,84,.25);
    border-radius:17px;
    padding:35px 20px;
    color:#8c7a7d;
    font-size:13px;
}

.empty strong{
    display:block;
    color:#6d595d;
    margin-bottom:7px;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:30px;
    color:#8c7a7d;
    font-size:13px;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(35,24,26,.55);
    backdrop-filter:blur(7px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:9999;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:390px;
    background:#fffaf9;
    border-radius:22px;
    padding:22px;
    box-shadow:0 20px 70px rgba(0,0,0,.22);
}

.modal h3{
    margin:0 0 6px;
    font-size:18px;
    color:#4b3035;
}

.modal-subtitle{
    font-size:12px;
    color:#8c7a7d;
    margin-bottom:20px;
}

.time-selectors{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.time-selector-box{
    text-align:center;
}

.time-selector-box label{
    display:block;
    font-size:11px;
    color:#806e71;
    margin-bottom:7px;
}

.time-selector{
    width:100%;
    height:145px;
    overflow-y:auto;
    border:1px solid rgba(79,108,84,.25);
    border-radius:14px;
    background:white;
    scrollbar-width:none;
}

.time-selector::-webkit-scrollbar{
    display:none;
}

.time-option{
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#806e71;
    font-size:14px;
}

.time-option.selected{
    background:#4f6c54;
    color:white;
    font-weight:bold;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:20px;
}

.modal-save{
    border:0;
    border-radius:12px;
    padding:12px;
    background:#4f6c54;
    color:white;
}

.modal-cancel{
    border:1px solid rgba(183,123,127,.35);
    border-radius:12px;
    padding:12px;
    background:white;
    color:#8e5e63;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:18px;
    bottom:18px;
    max-width:330px;
    background:#4b3035;
    color:white;
    padding:13px 16px;
    border-radius:13px;
    font-size:12px;
    opacity:0;
    transform:translateY(20px);
    pointer-events:none;
    transition:.3s;
    z-index:10000;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){

    .dashboard{
        padding:15px 11px 40px;
    }

    .topbar{
        align-items:flex-start;
    }

    .brand h1{
        font-size:21px;
    }

    .stats{
        gap:8px;
    }

    .stat{
        padding:12px 7px;
    }

    .stat-number{
        font-size:21px;
    }

    .stat-label{
        font-size:10px;
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

    .actions{
        grid-template-columns:1fr 1fr 1fr;
    }

}

</style>
</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            <strong>HOBAB</strong>
            <span>BEAUTY</span>
        </div>

        <h2>مدیریت رزروها</h2>

        <input
            type="email"
            id="loginEmail"
            class="login-input"
            placeholder="ایمیل">

        <input
            type="password"
            id="loginPassword"
            class="login-input"
            placeholder="رمز عبور">

        <button
            class="login-button"
            onclick="login()">
            ورود به پنل
        </button>

        <div
            class="login-error"
            id="loginError">
        </div>

    </div>

</div>



<!-- =========================
     DASHBOARD
========================= -->

<div class="dashboard" id="dashboard">

    <div class="topbar">

        <div class="brand">
            <h1>HOBAB BEAUTY</h1>
            <p>مدیریت رزروها</p>
        </div>

        <button
            class="logout"
            onclick="logout()">
            خروج
        </button>

    </div>


    <!-- NEW ALERT -->

    <div
        class="new-alert"
        id="newAlert">

        <div class="new-alert-text">

            <span class="alert-dot"></span>

            <span>
                رزرو جدید دارید
                <span id="newCountText"></span>
            </span>

        </div>

        <button onclick="showPending()">
            مشاهده
        </button>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <div
                class="stat-number"
                id="totalCount">
                0
            </div>

            <div class="stat-label">
                کل نوبت‌ها
            </div>
        </div>


        <div class="stat">
            <div
                class="stat-number"
                id="pendingCount">
                0
            </div>

            <div class="stat-label">
                در انتظار تأیید
            </div>
        </div>


        <div class="stat">
            <div
                class="stat-number"
                id="confirmedCount">
                0
            </div>

            <div class="stat-label">
                تأیید شده
            </div>
        </div>

    </div>


    <!-- DAYS -->

    <div class="section-title">
        نمایش نوبت‌ها
    </div>

    <div
        class="day-scroller"
        id="dayScroller">
    </div>


    <!-- STATUS -->

    <div class="status-filter">

        <button
            class="status-button active"
            data-status="all"
            onclick="setStatus('all',this)">
            همه
        </button>

        <button
            class="status-button"
            data-status="pending"
            onclick="setStatus('pending',this)">
            در انتظار
        </button>

        <button
            class="status-button"
            data-status="confirmed"
            onclick="setStatus('confirmed',this)">
            تأیید شده
        </button>

    </div>


    <!-- SERVICES -->

    <div class="service-tabs">

        <button
            class="service-tab active"
            data-service="all"
            onclick="setService('all',this)">
            همه
            <span class="service-badge"></span>
        </button>


        <button
            class="service-tab"
            data-service="مو"
            onclick="setService('مو',this)">
            مو
            <span class="service-badge"></span>
        </button>


        <button
            class="service-tab"
            data-service="میکاپ"
            onclick="setService('میکاپ',this)">
            میکاپ
            <span class="service-badge"></span>
        </button>


        <button
            class="service-tab"
            data-service="ناخن"
            onclick="setService('ناخن',this)">
            ناخن
            <span class="service-badge"></span>
        </button>


        <button
            class="service-tab"
            data-service="مژه"
            onclick="setService('مژه',this)">
            مژه
            <span class="service-badge"></span>
        </button>


        <button
            class="service-tab"
            data-service="ابرو"
            onclick="setService('ابرو',this)">
            ابرو
            <span class="service-badge"></span>
        </button>


        <button
            class="service-tab"
            data-service="پوست"
            onclick="setService('پوست',this)">
            پوست
            <span class="service-badge"></span>
        </button>


        <button
            class="service-tab"
            data-service="عروس"
            onclick="setService('عروس',this)">
            عروس
            <span class="service-badge"></span>
        </button>

    </div>


    <!-- APPOINTMENTS -->

    <div id="appointmentsContainer">
        <div class="loading">
            در حال دریافت نوبت‌ها...
        </div>
    </div>

</div>



<!-- =========================
     TIME MODAL
========================= -->

<div
    class="modal-overlay"
    id="timeModal">

    <div class="modal">

        <h3>
            تعیین ساعت دقیق نوبت
        </h3>

        <div
            class="modal-subtitle"
            id="modalCustomer">
        </div>


        <div class="time-selectors">

            <div class="time-selector-box">

                <label>
                    ساعت
                </label>

                <div
                    class="time-selector"
                    id="hourSelector">
                </div>

            </div>


            <div class="time-selector-box">

                <label>
                    دقیقه
                </label>

                <div
                    class="time-selector"
                    id="minuteSelector">

                    <div
                        class="time-option selected"
                        data-value="00"
                        onclick="selectMinute(this)">
                        00
                    </div>

                    <div
                        class="time-option"
                        data-value="30"
                        onclick="selectMinute(this)">
                        30
                    </div>

                </div>

            </div>

        </div>


        <div class="modal-actions">

            <button
                class="modal-save"
                onclick="saveConfirmedTime()">
                ثبت ساعت
            </button>

            <button
                class="modal-cancel"
                onclick="closeTimeModal()">
                انصراف
            </button>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast">
</div>



<script>

const SUPABASE_URL =

const SUPABASE_KEY =

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY

/* =========================

let appointments = [];

let selectedDay = "today";

let refreshTimer = null;

const serviceGroups = {

/* =========================
   PERSIAN NUMBERS
========================= */

function toPersianNumber(value){

    return String(value)
        .replace(/0/g,"۰")
        .replace(/1/g,"۱")
        .replace(/2/g,"۲")
        .replace(/3/g,"۳")
        .replace(/4/g,"۴")
        .replace(/5/g,"۵")
        .replace(/6/g,"۶")
        .replace(/7/g,"۷")
        .replace(/8/g,"۸")
        .replace(/9/g,"۹");

}


/* =========================
   JALALI DATE
========================= */

function getJalaliDate(offset = 0){

    const date = new Date();

    date.setDate(
        date.getDate() + offset
    );

    const formatter =
        new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );

    const parts =
        formatter.formatToParts(date);

    let year = "";
    let month = "";
    let day = "";

    parts.forEach(part => {

        if(part.type === "year"){
            year = part.value;
        }

        if(part.type === "month"){
            month = part.value;
        }

        if(part.type === "day"){
            day = part.value;
        }

    });

    return {
        year,
        month,
        day,
        text:
            `${day} ${month} ${year}`
    };

}


/* =========================
   BUILD DAY FILTER
========================= */

function buildDayFilter(){

    const container =
        document.getElementById(
            "dayScroller"
        );

    container.innerHTML = "";

    const dayNames = [
        "امروز",
        "فردا",
        "پس‌فردا",
        "۳ روز بعد",
        "۴ روز بعد",
        "۵ روز بعد",
        "۶ روز بعد",
        "۷ روز بعد"
    ];

    for(
        let i = 0;
        i <= 7;
        i++
    ){

        const date =
            getJalaliDate(i);

        const button =
            document.createElement("button");

        button.className =
            "day-button";

        if(i === 0){

            button.classList.add(
                "today"
            );

        }

        if(
            selectedDay ===
            String(i)
        ){

            button.classList.add(
                "active"
            );

        }

        button.innerHTML = `
            ${dayNames[i]}
            <small>
                ${date.day} ${date.month}
            </small>
        `;

        button.onclick =
            function(){

                selectedDay =
                    String(i);

                buildDayFilter();

                renderAppointments();

            };

        container.appendChild(button);

    }


    const allButton =
        document.createElement("button");

    allButton.className =
        "day-button";

    if(selectedDay === "all"){

        allButton.classList.add(
            "active"
        );

    }

    allButton.innerHTML = `
        همه
        <small>
            تمام نوبت‌ها
        </small>
    `;

    allButton.onclick =
        function(){

            selectedDay = "all";

            buildDayFilter();

            renderAppointments();

        };

    container.appendChild(allButton);

}

/* =========================
   LOAD APPOINTMENTS
========================= */

async function loadAppointments(
    silent = false
){

    if(!silent){

        document
            .getElementById(
                "appointmentsContainer"
            )
            .innerHTML = `
                <div class="loading">
                    در حال دریافت نوبت‌ها...
                </div>
            `;

    }

    const {
        data,
        error
    } =
        await supabaseClient
        .from("appointments")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );

    if(error){

        document
            .getElementById(
                "appointmentsContainer"
            )
            .innerHTML = `
                <div class="empty">
                    <strong>
                        خطا در دریافت نوبت‌ها
                    </strong>
                    دوباره تلاش کنید.
                </div>
            `;

        return;

    }

    const oldPendingIds =
        new Set(
            appointments
                .filter(a => !a.confirmed)
                .map(a => a.id)
        );

    appointments =
        data || [];

    const newPending =
        appointments.filter(
            a => !a.confirmed
        );

    updateStats();

    updateServiceBadges();

    if(!firstLoad){

        const reallyNew =
            newPending.filter(
                a =>
                    !oldPendingIds.has(a.id) &&
                    !knownPendingIds.has(a.id)
            );

        if(reallyNew.length){

            showToast(
                "یک رزرو جدید ثبت شد"
            );

            browserNotification(
                "رزرو جدید HOBAB BEAUTY",
                "یک رزرو جدید ثبت شده است."
            );

        }

    }

    knownPendingIds =
        new Set(
            newPending.map(
                a => a.id
            )
        );

    firstLoad = false;

    renderAppointments();

}

function belongsToService(

    group
){

    if(!appointmentService){

        return false;

    if(

    ){

        return true;

    }

    const list =
        serviceGroups[group] || [];

    return list.includes(
        appointmentService
    );

}

/* =========================
   FILTER DATE
========================= */

function appointmentMatchesDay(
    appointment
){

    if(selectedDay === "all"){

        return true;

    }

    const target =
        getJalaliDate(
            Number(selectedDay)
        );

    return normalizeText(
        appointment.date
    ) === normalizeText(
        target.text
    );

}


/* =========================
   NORMALIZE
========================= */

function normalizeText(text){

    if(!text){

        return "";

    }

    return String(text)
        .replace(/ي/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/[۰-۹]/g,
            d =>
                "0123456789"[
                    "۰۱۲۳۴۵۶۷۸۹"
                    .indexOf(d)
                ]
        )
        .trim();

}


/* =========================
   RENDER
========================= */

function renderAppointments(){

    let filtered =
        appointments.filter(
            appointment => {

                if(
                    !appointmentMatchesDay(
                        appointment
                    )
                ){

                    return false;

                }

                if(
                    selectedStatus ===
                    "pending" &&
                    appointment.confirmed
                ){

                    return false;

                }

                if(
                    selectedStatus ===
                    "confirmed" &&
                    !appointment.confirmed
                ){

                    return false;

                }

                if(
                    selectedService !==
                    "all" &&
                    !belongsToService(
                        appointment.service,
                        selectedService
                    )
                ){

                    return false;

                }

                return true;

            }
        );


    /* SORT */

    filtered.sort(
        function(a,b){

            const da =
                normalizeText(
                    a.date
                );

            const db =
                normalizeText(
                    b.date
                );

            if(da < db){

                return -1;

            }

            if(da > db){

                return 1;

            }

            const ta =
                a.confirmed_time ||
                a.time ||
                "";

            const tb =
                b.confirmed_time ||
                b.time ||
                "";

            return String(ta)
                .localeCompare(
                    String(tb)
                );

        }
    );


    const container =
        document.getElementById(
            "appointmentsContainer"
        );


    if(!filtered.length){

        let title =
            "نوبتی وجود ندارد";

        if(selectedDay !== "all"){

            const target =
                getJalaliDate(
                    Number(selectedDay)
                );

            title =
                `برای ${target.text} نوبتی ثبت نشده است`;

        }

        container.innerHTML = `
            <div class="empty">
                <strong>
                    ${title}
                </strong>
                نوبت دیگری برای نمایش وجود ندارد.
            </div>
        `;

        return;

    }


    /* GROUP BY DATE */

    const groups = {};

    filtered.forEach(
        appointment => {

            const key =
                appointment.date ||
                "بدون تاریخ";

            if(!groups[key]){

                groups[key] = [];

            }

            groups[key].push(
                appointment
            );

        }
    );


    let html = "";

    Object.keys(groups)
        .forEach(
            date => {

                const items =
                    groups[date];

                html += `
                    <div class="date-group">

                        <div class="date-title">

                            <div class="date-title-main">
                                ${date}
                            </div>

                            <div class="date-count">
                                ${toPersianNumber(items.length)}
                                نوبت
                            </div>

                        </div>
                `;


                items.forEach(
                    appointment => {

                        html +=
                            appointmentCard(
                                appointment
                            );

                    }
                );


                html += `
                    </div>
                `;

            }
        );


    container.innerHTML =
        html;

}

/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}

   CALL
========================= */

function callCustomer(phone){

}


/* =========================
   TIME MODAL
========================= */

function openTimeModal(
    id
){

    const appointment =
        appointments.find(
            a => String(a.id) ===
            String(id)
        );

    if(!appointment){

        return;

    }

    currentAppointmentId =
        id;


    document
        .getElementById(
            "modalCustomer"
        )
        .textContent =
        `${appointment.name || "مشتری"} — ${appointment.date || ""}`;


    buildHourSelector(
        appointment.confirmed_time
    );


    document
        .getElementById(
            "minuteSelector"
        )
        .querySelectorAll(
            ".time-option"
        )
        .forEach(
            option =>
                option.classList.remove(
                    "selected"
                )
        );


    let minute =
        "00";

    if(
        appointment.confirmed_time &&
        appointment.confirmed_time.includes(":")
    ){

        minute =
            appointment
                .confirmed_time
                .split(":")[1];

    }

    if(
        minute !== "30"
    ){

        minute = "00";

    }

    selectedMinute =
        minute;


    const minuteOption =
        document
            .getElementById(
                "minuteSelector"
            )
            .querySelector(
                `[data-value="${minute}"]`
            );

    if(minuteOption){

        minuteOption.classList.add(
            "selected"
        );

    }


    document
        .getElementById(
            "timeModal"
        )
        .classList.add(
            "show"
        );

}


/* =========================
   HOURS
========================= */

function buildHourSelector(
    existingTime
){

    const container =
        document.getElementById(
            "hourSelector"
        );

    container.innerHTML = "";

    let existingHour =
        "09";

    if(
        existingTime &&
        existingTime.includes(":")
    ){

        existingHour =
            existingTime
                .split(":")[0];

    }

    selectedHour =
        existingHour;


    for(
        let h = 8;
        h <= 20;
        h++
    ){

        const hour =
            String(h)
            .padStart(2,"0");

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "time-option";

        if(
            hour === existingHour
        ){

            div.classList.add(
                "selected"
            );

        }

        div.dataset.value =
            hour;

        div.textContent =
            toPersianNumber(hour);

        div.onclick =
            function(){

                document
                    .querySelectorAll(
                        "#hourSelector .time-option"
                    )
                    .forEach(
                        option =>
                            option.classList.remove(
                                "selected"
                            )
                    );

                div.classList.add(
                    "selected"
                );

                selectedHour =
                    hour;

            };

        container.appendChild(
            div
        );

    }

}


/* =========================
   MINUTE
========================= */

function selectMinute(
    element
){

    document
        .querySelectorAll(
            "#minuteSelector .time-option"
        )
        .forEach(
            option =>
                option.classList.remove(
                    "selected"
                )
        );

    element.classList.add(
        "selected"
    );

    selectedMinute =
        element.dataset.value;

}


/* =========================
   SAVE CONFIRMED TIME
========================= */

async function saveConfirmedTime(){

    if(!currentAppointmentId){

        return;

    }

    const exactTime =
        `${selectedHour}:${selectedMinute}`;


    const {
        error
    } =
        await supabaseClient
        .from("appointments")
        .update({

            confirmed:true,

            confirmed_time:
                exactTime

        })
        .eq(
            "id",
            currentAppointmentId
        );


    if(error){

        showToast(
            "ثبت ساعت انجام نشد"
        );

        return;

    }


    closeTimeModal();

    showToast(
        "ساعت نوبت با موفقیت ثبت شد"
    );

    await loadAppointments(true);

}

   CLOSE MODAL
========================= */

function closeTimeModal(){

    document
        .getElementById(
            "timeModal"
        )
        .classList.remove(
            "show"
        );

    currentAppointmentId =
        null;

}


/* =========================
   DELETE
========================= */

async function deleteAppointment(
    id
){

    const appointment =
        appointments.find(
            a =>
                String(a.id) ===
                String(id)
        );


    const customer =
        appointment &&
        appointment.name
            ? appointment.name
            : "این نوبت";


    const ok =
        confirm(
            `آیا از حذف نوبت ${customer} مطمئن هستید؟`
        );


    if(!ok){

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from("appointments")
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        showToast(
            "حذف نوبت انجام نشد"
        );

        return;

    }


    showToast(
        "نوبت حذف شد"
    );


    await loadAppointments(true);

}

/* =========================
   BROWSER NOTIFICATION
========================= */

function browserNotification(
    title,
    body
){

    if(
        !("Notification" in window)
    ){

        return;

    }

    if(
        Notification.permission ===
        "granted"
    ){

        new Notification(
            title,
            {
                body:body
            }
        );

    }

}


/* =========================
   REQUEST NOTIFICATION
========================= */

async function requestNotificationPermission(){

    if(
        !("Notification" in window)
    ){

        return;

    }

    if(
        Notification.permission ===
        "default"
    ){

        try{

            await Notification.requestPermission();

        }catch(e){}

    }

}


/* =========================
   INIT
========================= */

async function init(){

    buildDayFilter();

    const {
        data
    } =
        await supabaseClient
        .auth
        .getSession();


    if(
        data &&
        data.session
    ){

        showDashboard();

    }else{

        document
            .getElementById(
                "loginPage"
            )
            .style.display =
            "flex";

    }


    requestNotificationPermission();

}


/* =========================
   AUTH STATE
========================= */

supabaseClient
    .auth
    .onAuthStateChange(
        function(
            event,
            session
        ){

            if(
                session &&
                event ===
                "SIGNED_IN"
            ){

                showDashboard();

            }

        }
    );


/* =========================
   CLOSE MODAL BY BACKDROP
========================= */

document
    .getElementById(
        "timeModal"
    )
    .addEventListener(
        "click",
        function(e){

            if(
                e.target ===
                this
            ){

                closeTimeModal();

            }

        }
    );


/* =========================
   START
========================= */

init();

</script>

</body>
</html>

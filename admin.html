<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>پنل مدیریت | HOBAB BEAUTY</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Vazirmatn',sans-serif;
            background:#fff8f6;
            color:#4b3035;
            min-height:100vh;
        }

        /* =========================
           LOGIN
        ========================= */

        .login-page{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        .login-box{
            width:min(400px,100%);
            background:rgba(255,255,255,.82);
            border:1px solid rgba(130,90,90,.13);
            border-radius:28px;
            padding:32px 25px;
            box-shadow:0 20px 60px rgba(90,50,50,.08);
            text-align:center;
        }

        .login-logo{
            font-size:27px;
            font-weight:700;
            letter-spacing:2px;
        }

        .login-sub{
            margin-top:5px;
            color:#9b7b81;
            font-size:13px;
        }

        .login-box input{
            width:100%;
            margin-top:14px;
            padding:14px;
            border:1px solid #e4d8d8;
            border-radius:14px;
            outline:none;
            font-family:inherit;
            background:#fff;
        }

        .login-box button{
            width:100%;
            margin-top:16px;
            padding:14px;
            border:none;
            border-radius:14px;
            background:#76535b;
            color:#fff;
            font-family:inherit;
            cursor:pointer;
        }

        .login-error{
            color:#b44e5b;
            font-size:12px;
            margin-top:12px;
            min-height:18px;
        }

        /* =========================
           ADMIN
        ========================= */

        .admin-page{
            display:none;
            min-height:100vh;
        }

        .header{
            padding:22px 18px;
            background:rgba(255,255,255,.78);
            border-bottom:1px solid rgba(130,90,90,.12);
            backdrop-filter:blur(15px);
            position:sticky;
            top:0;
            z-index:10;
        }

        .header-inner{
            width:min(1100px,94%);
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
        }

        .brand h1{
            font-size:21px;
        }

        .brand p{
            font-size:12px;
            color:#9b7b81;
            margin-top:3px;
        }

        .logout{
            border:none;
            padding:9px 14px;
            border-radius:11px;
            background:#f2e7e7;
            color:#6f4b53;
            font-family:inherit;
            cursor:pointer;
        }

        .container{
            width:min(1100px,94%);
            margin:25px auto 50px;
        }

        /* =========================
           CATEGORIES
        ========================= */

        .section-title{
            font-size:18px;
            margin-bottom:14px;
        }

        .categories{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:12px;
        }

        .category{
            border:1px solid #eadede;
            background:rgba(255,255,255,.8);
            border-radius:20px;
            padding:19px 12px;
            font-family:inherit;
            color:#5a3b42;
            cursor:pointer;
            transition:.2s;
            text-align:center;
        }

        .category:hover{
            transform:translateY(-2px);
        }

        .category.active{
            background:#76535b;
            color:#fff;
            border-color:#76535b;
            box-shadow:0 10px 25px rgba(100,65,70,.15);
        }

        .category-name{
            display:block;
            font-size:15px;
            font-weight:600;
        }

        .category-count{
            display:block;
            margin-top:6px;
            font-size:11px;
            opacity:.7;
        }

        /* =========================
           APPOINTMENTS
        ========================= */

        .appointments-panel{
            margin-top:25px;
            background:rgba(255,255,255,.8);
            border:1px solid #eadede;
            border-radius:24px;
            padding:20px;
        }

        .appointments-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            margin-bottom:17px;
        }

        .appointments-head h2{
            font-size:18px;
        }

        .refresh{
            border:none;
            background:#f2e7e7;
            color:#6f4b53;
            padding:9px 13px;
            border-radius:11px;
            font-family:inherit;
            cursor:pointer;
        }

        .appointment-list{
            display:grid;
            gap:12px;
        }

        .appointment{
            border:1px solid #eee2e2;
            border-radius:17px;
            padding:16px;
            background:#fff;
        }

        .appointment-top{
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:10px;
        }

        .appointment-name{
            font-weight:700;
            font-size:15px;
        }

        .appointment-time{
            background:#f5e9e9;
            color:#704b53;
            padding:6px 10px;
            border-radius:9px;
            font-size:12px;
            white-space:nowrap;
        }

        .appointment-info{
            margin-top:12px;
            display:grid;
            gap:7px;
            font-size:13px;
            color:#735d62;
        }

        .appointment-info strong{
            color:#4b3035;
        }

        .description{
            border-top:1px solid #eee4e4;
            margin-top:12px;
            padding-top:12px;
            font-size:13px;
            line-height:1.8;
            color:#755f64;
        }

        /* =========================
           ACTIONS
        ========================= */

        .appointment-actions{
            display:flex;
            gap:9px;
            margin-top:15px;
            padding-top:14px;
            border-top:1px solid #eee4e4;
        }

        .call-btn,
        .delete-btn{
            flex:1;
            border:none;
            border-radius:11px;
            padding:11px 12px;
            font-family:inherit;
            font-size:13px;
            cursor:pointer;
            text-decoration:none;
            text-align:center;
            transition:.2s;
        }

        .call-btn{
            background:#f1e8e8;
            color:#6f4b53;
        }

        .call-btn:hover{
            background:#e9dddd;
        }

        .delete-btn{
            background:#f7e5e5;
            color:#b04f5b;
        }

        .delete-btn:hover{
            background:#f0d8d8;
        }

        .delete-btn:disabled{
            opacity:.6;
            cursor:not-allowed;
        }

        .empty{
            text-align:center;
            padding:45px 10px;
            color:#a48d91;
            font-size:13px;
        }

        .loading{
            text-align:center;
            padding:35px;
            color:#9a7c82;
            font-size:13px;
        }

        @media(max-width:700px){

            .categories{
                grid-template-columns:repeat(2,1fr);
            }

            .appointments-panel{
                padding:15px;
            }

            .appointment-actions{
                flex-direction:row;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<section
    class="login-page"
    id="loginPage"
>

    <div class="login-box">

        <div class="login-logo">
            HOBAB
        </div>

        <div class="login-sub">
            پنل مدیریت سالن زیبایی
        </div>

        <input
            type="email"
            id="email"
            placeholder="ایمیل مدیر"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="رمز عبور"
            autocomplete="current-password"
        >

        <button id="loginBtn">
            ورود به پنل
        </button>

        <div
            class="login-error"
            id="loginError"
        ></div>

    </div>

</section>


<!-- =========================
     ADMIN PAGE
========================= -->

<section
    class="admin-page"
    id="adminPage"
>

<header class="header">

    <div class="header-inner">

        <div class="brand">

            <h1>
                HOBAB BEAUTY
            </h1>

            <p>
                مدیریت نوبت‌ها
            </p>

        </div>

        <button
            class="logout"
            id="logoutBtn"
        >
            خروج
        </button>

    </div>

</header>


<main class="container">

    <h2 class="section-title">
        بخش خدمات
    </h2>


    <div class="categories">

        <button
            class="category active"
            data-service="hair"
            data-name="مو"
        >
            <span class="category-name">
                مو
            </span>

            <span class="category-count">
                ۰ نوبت
            </span>
        </button>


        <button
            class="category"
            data-service="makeup"
            data-name="میکاپ"
        >
            <span class="category-name">
                میکاپ
            </span>

            <span class="category-count">
                ۰ نوبت
            </span>
        </button>


        <button
            class="category"
            data-service="nail"
            data-name="ناخن"
        >
            <span class="category-name">
                ناخن
            </span>

            <span class="category-count">
                ۰ نوبت
            </span>
        </button>


        <button
            class="category"
            data-service="lash"
            data-name="مژه"
        >
            <span class="category-name">
                مژه
            </span>

            <span class="category-count">
                ۰ نوبت
            </span>
        </button>


        <button
            class="category"
            data-service="brow"
            data-name="ابرو"
        >
            <span class="category-name">
                ابرو
            </span>

            <span class="category-count">
                ۰ نوبت
            </span>
        </button>


        <button
            class="category"
            data-service="skin"
            data-name="مراقبت پوست"
        >
            <span class="category-name">
                مراقبت پوست
            </span>

            <span class="category-count">
                ۰ نوبت
            </span>
        </button>


        <button
            class="category"
            data-service="bridal"
            data-name="عروس"
        >
            <span class="category-name">
                عروس
            </span>

            <span class="category-count">
                ۰ نوبت
            </span>
        </button>

    </div>


    <section class="appointments-panel">

        <div class="appointments-head">

            <h2 id="appointmentsTitle">
                نوبت‌های مو
            </h2>

            <button
                class="refresh"
                id="refreshBtn"
            >
                بروزرسانی
            </button>

        </div>


        <div
            class="appointment-list"
            id="appointmentList"
        >

            <div class="loading">
                در حال دریافت نوبت‌ها...
            </div>

        </div>

    </section>


</main>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://oeadtawmcbzblkmfqmbd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_1t6kJsgr3IwQkWptFgJ1Iw_Fj1FB4U2";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginPage =
    document.getElementById("loginPage");

const adminPage =
    document.getElementById("adminPage");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginError =
    document.getElementById("loginError");

const appointmentList =
    document.getElementById("appointmentList");

const appointmentsTitle =
    document.getElementById("appointmentsTitle");

const refreshBtn =
    document.getElementById("refreshBtn");

const categories =
    document.querySelectorAll(".category");


let appointments = [];

let selectedService = "hair";


const serviceNames = {

    hair:"مو",

    makeup:"میکاپ",

    nail:"ناخن",

    lash:"مژه",

    brow:"ابرو",

    skin:"مراقبت پوست",

    bridal:"عروس"

};


/* =========================
   CHECK SESSION
========================= */

async function checkSession(){

    const {
        data:{
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if(session){

        showAdmin();

    }else{

        showLogin();

    }

}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    async function(){

        loginError.textContent = "";

        const email =
            document.getElementById("email")
                .value.trim();

        const password =
            document.getElementById("password")
                .value;


        if(!email || !password){

            loginError.textContent =
                "ایمیل و رمز عبور را وارد کنید.";

            return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "در حال ورود...";


        const {
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email:email,

                password:password

            });


        loginBtn.disabled = false;

        loginBtn.textContent =
            "ورود به پنل";


        if(error){

            loginError.textContent =
                "ایمیل یا رمز عبور اشتباه است.";

            return;
        }


        showAdmin();

    }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        appointments = [];

        showLogin();

    }
);


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

    loginPage.style.display =
        "flex";

    adminPage.style.display =
        "none";

}


/* =========================
   SHOW ADMIN
========================= */

async function showAdmin(){

    loginPage.style.display =
        "none";

    adminPage.style.display =
        "block";

    await loadAppointments();

}


/* =========================
   LOAD APPOINTMENTS
========================= */

async function loadAppointments(){

    appointmentList.innerHTML =
        `<div class="loading">
            در حال دریافت نوبت‌ها...
        </div>`;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("appointments")
            .select("*")
            .order(
                "date",
                {
                    ascending:true
                }
            )
            .order(
                "time",
                {
                    ascending:true
                }
            );


    if(error){

        console.error(error);

        appointmentList.innerHTML =
            `<div class="empty">
                دریافت نوبت‌ها انجام نشد.
            </div>`;

        return;
    }


    appointments =
        data || [];


    updateCounts();

    renderAppointments();

}


/* =========================
   COUNTS
========================= */

function updateCounts(){

    categories.forEach(
        category => {

            const service =
                category.dataset.service;


            const count =
                appointments.filter(
                    appointment =>
                        appointment.service === service
                ).length;


            const countElement =
                category.querySelector(
                    ".category-count"
                );


            countElement.textContent =
                toPersianDigits(count)
                + " نوبت";

        }
    );

}


/* =========================
   CATEGORY CLICK
========================= */

categories.forEach(
    category => {

        category.addEventListener(
            "click",
            function(){

                categories.forEach(
                    item =>
                        item.classList.remove(
                            "active"
                        )
                );


                this.classList.add(
                    "active"
                );


                selectedService =
                    this.dataset.service;


                appointmentsTitle.textContent =
                    "نوبت‌های "
                    + this.dataset.name;


                renderAppointments();

            }
        );

    }
);


/* =========================
   RENDER
========================= */

function renderAppointments(){

    const filtered =
        appointments.filter(
            appointment =>
                appointment.service ===
                selectedService
        );


    if(!filtered.length){

        appointmentList.innerHTML =
            `<div class="empty">
                برای این بخش هنوز نوبتی ثبت نشده است.
            </div>`;

        return;
    }


    appointmentList.innerHTML =
        filtered.map(
            appointment => {

                const phone =
                    String(
                        appointment.phone || ""
                    ).trim();

                const safePhone =
                    phone.replace(
                        /[^0-9+]/g,
                        ""
                    );

                return `

                <article
                    class="appointment"
                    data-id="${escapeHtml(
                        appointment.id
                    )}"
                >

                    <div class="appointment-top">

                        <div class="appointment-name">
                            ${escapeHtml(
                                appointment.name || "-"
                            )}
                        </div>


                        <div class="appointment-time">

                            ${escapeHtml(
                                appointment.date || "-"
                            )}

                            -

                            ${escapeHtml(
                                appointment.time || "-"
                            )}

                        </div>

                    </div>


                    <div class="appointment-info">

                        <div>
                            <strong>
                                شماره تماس:
                            </strong>

                            ${escapeHtml(
                                appointment.phone || "-"
                            )}
                        </div>


                        <div>
                            <strong>
                                خدمت:
                            </strong>

                            ${escapeHtml(
                                serviceNames[
                                    appointment.service
                                ] ||
                                appointment.service ||
                                "-"
                            )}
                        </div>

                    </div>


                    <div class="description">

                        <strong>
                            توضیحات:
                        </strong>

                        <br>

                        ${escapeHtml(
                            appointment.description || "-"
                        )}

                    </div>


                    <div class="appointment-actions">

                        <a
                            class="call-btn"
                            href="tel:${escapeHtml(
                                safePhone
                            )}"
                        >
                            تماس با مشتری
                        </a>


                        <button
                            type="button"
                            class="delete-btn"
                            onclick="deleteAppointment('${escapeHtml(
                                appointment.id
                            )}')"
                        >
                            حذف نوبت
                        </button>

                    </div>

                </article>

                `;

            }
        ).join("");

}


/* =========================
   DELETE APPOINTMENT
========================= */

async function deleteAppointment(id){

    const appointment =
        appointments.find(
            item =>
                String(item.id) === String(id)
        );


    if(!appointment){

        alert("نوبت موردنظر پیدا نشد.");

        return;
    }


    const customerName =
        appointment.name || "این مشتری";


    const confirmed =
        confirm(
            `آیا مطمئن هستید نوبت «${customerName}» حذف شود؟`
        );


    if(!confirmed){

        return;
    }


    const deleteButtons =
        document.querySelectorAll(
            `.delete-btn`
        );


    deleteButtons.forEach(
        button => {

            button.disabled = true;

        }
    );


    const {
        error
    } =
        await supabaseClient
            .from("appointments")
            .delete()
            .eq("id", id);


    if(error){

        console.error(error);

        deleteButtons.forEach(
            button => {

                button.disabled = false;

            }
        );

        alert(
            "حذف نوبت انجام نشد."
        );

        return;
    }


    appointments =
        appointments.filter(
            item =>
                String(item.id) !== String(id)
        );


    updateCounts();

    renderAppointments();

}


/* =========================
   REFRESH
========================= */

refreshBtn.addEventListener(
    "click",
    loadAppointments
);


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   PERSIAN NUMBERS
========================= */

function toPersianDigits(value){

    return String(value)
        .replace(
            /\d/g,
            digit =>
                "۰۱۲۳۴۵۶۷۸۹"[digit]
        );

}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
    function(
        event,
        session
    ){

        if(session){

            showAdmin();

        }else{

            showLogin();

        }

    }
);


checkSession();

</script>

</body>
</html>

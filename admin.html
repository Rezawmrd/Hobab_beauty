<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://oeadtawmcbzblkmfqmbd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_1t6kJsgr3IwQkWptFgJ1Iw_Fj1FB4U2";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginPage =
    document.getElementById("loginPage");

const adminPage =
    document.getElementById("adminPage");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginError =
    document.getElementById("loginError");

const appointmentList =
    document.getElementById("appointmentList");

const appointmentsTitle =
    document.getElementById("appointmentsTitle");

const refreshBtn =
    document.getElementById("refreshBtn");

const categories =
    document.querySelectorAll(".category");


let appointments = [];

let selectedService = "hair";


const serviceNames = {

    hair:"مو",

    makeup:"میکاپ",

    nail:"ناخن",

    lash:"مژه",

    brow:"ابرو",

    skin:"مراقبت پوست",

    bridal:"عروس"

};


/* =========================
   CHECK SESSION
========================= */

async function checkSession(){

    const {
        data:{
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if(session){

        showAdmin();

    }else{

        showLogin();

    }

}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    async function(){

        loginError.textContent = "";

        const email =
            document.getElementById("email")
                .value.trim();

        const password =
            document.getElementById("password")
                .value;


        if(!email || !password){

            loginError.textContent =
                "ایمیل و رمز عبور را وارد کنید.";

            return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "در حال ورود...";


        const {
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email:email,

                password:password

            });


        loginBtn.disabled = false;

        loginBtn.textContent =
            "ورود به پنل";


        if(error){

            loginError.textContent =
                "ایمیل یا رمز عبور اشتباه است.";

            return;
        }


        showAdmin();

    }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        appointments = [];

        showLogin();

    }
);


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

    loginPage.style.display =
        "flex";

    adminPage.style.display =
        "none";

}


/* =========================
   SHOW ADMIN
========================= */

async function showAdmin(){

    loginPage.style.display =
        "none";

    adminPage.style.display =
        "block";

    await loadAppointments();

}


/* =========================
   LOAD APPOINTMENTS
========================= */

async function loadAppointments(){

    appointmentList.innerHTML =
        `<div class="loading">
            در حال دریافت نوبت‌ها...
        </div>`;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("appointments")
            .select("*")
            .order(
                "date",
                {
                    ascending:true
                }
            )
            .order(
                "time",
                {
                    ascending:true
                }
            );


    if(error){

        console.error(error);

        appointmentList.innerHTML =
            `<div class="empty">
                دریافت نوبت‌ها انجام نشد.
            </div>`;

        return;
    }


    appointments =
        data || [];


    updateCounts();

    renderAppointments();

}


/* =========================
   COUNTS
========================= */

function updateCounts(){

    categories.forEach(
        category => {

            const service =
                category.dataset.service;


            const count =
                appointments.filter(
                    appointment =>
                        appointment.service === service
                ).length;


            const countElement =
                category.querySelector(
                    ".category-count"
                );


            countElement.textContent =
                toPersianDigits(count)
                + " نوبت";

        }
    );

}


/* =========================
   CATEGORY CLICK
========================= */

categories.forEach(
    category => {

        category.addEventListener(
            "click",
            function(){

                categories.forEach(
                    item =>
                        item.classList.remove(
                            "active"
                        )
                );


                this.classList.add(
                    "active"
                );


                selectedService =
                    this.dataset.service;


                appointmentsTitle.textContent =
                    "نوبت‌های "
                    + this.dataset.name;


                renderAppointments();

            }
        );

    }
);


/* =========================
   RENDER APPOINTMENTS
========================= */

function renderAppointments(){

    const filtered =
        appointments.filter(
            appointment =>
                appointment.service ===
                selectedService
        );


    if(!filtered.length){

        appointmentList.innerHTML =
            `<div class="empty">
                برای این بخش هنوز نوبتی ثبت نشده است.
            </div>`;

        return;
    }


    /* =========================
       GROUP BY DATE
    ========================= */

    const groups = {};


    filtered.forEach(
        appointment => {

            const date =
                appointment.date || "-";


            if(!groups[date]){

                groups[date] = [];

            }


            groups[date].push(
                appointment
            );

        }
    );


    /* =========================
       SORT DATES
    ========================= */

    const sortedDates =
        Object.keys(groups).sort(
            (a,b) =>
                normalizeDateForSort(a) -
                normalizeDateForSort(b)
        );


    /* =========================
       TODAY
    ========================= */

    const today =
        getTodayJalaliForAdmin();


    appointmentList.innerHTML =
        sortedDates
            .map(
                date => {

                    const dayAppointments =
                        groups[date].sort(
                            (a,b) =>
                                String(
                                    a.time || ""
                                ).localeCompare(
                                    String(
                                        b.time || ""
                                    )
                                )
                        );


                    const dayLabel =
                        getDayLabel(
                            date,
                            today
                        );


                    return `

                        <div class="day-group">

                            <div class="day-group-title">

                                <div>
                                    ${dayLabel}
                                </div>

                                <span>
                                    ${escapeHtml(
                                        date
                                    )}
                                </span>

                            </div>


                            <div class="day-group-list">

                                ${dayAppointments
                                    .map(
                                        appointment => {

                                            const phone =
                                                String(
                                                    appointment.phone || ""
                                                ).trim();


                                            const safePhone =
                                                phone.replace(
                                                    /[^0-9+]/g,
                                                    ""
                                                );


                                            return `

                                            <article
                                                class="appointment"
                                                data-id="${escapeHtml(
                                                    appointment.id
                                                )}"
                                            >

                                                <div class="appointment-top">

                                                    <div class="appointment-name">
                                                        ${escapeHtml(
                                                            appointment.name || "-"
                                                        )}
                                                    </div>


                                                    <div class="appointment-time">

                                                        ${escapeHtml(
                                                            appointment.time || "-"
                                                        )}

                                                    </div>

                                                </div>


                                                <div class="appointment-info">

                                                    <div>
                                                        <strong>
                                                            شماره تماس:
                                                        </strong>

                                                        ${escapeHtml(
                                                            appointment.phone || "-"
                                                        )}
                                                    </div>


                                                    <div>
                                                        <strong>
                                                            خدمت:
                                                        </strong>

                                                        ${escapeHtml(
                                                            serviceNames[
                                                                appointment.service
                                                            ] ||
                                                            appointment.service ||
                                                            "-"
                                                        )}
                                                    </div>

                                                </div>


                                                <div class="description">

                                                    <strong>
                                                        توضیحات:
                                                    </strong>

                                                    <br>

                                                    ${escapeHtml(
                                                        appointment.description || "-"
                                                    )}

                                                </div>


                                                <div class="appointment-actions">

                                                    <a
                                                        class="call-btn"
                                                        href="tel:${escapeHtml(
                                                            safePhone
                                                        )}"
                                                    >
                                                        تماس با مشتری
                                                    </a>


                                                    <button
                                                        type="button"
                                                        class="delete-btn"
                                                        onclick="deleteAppointment('${escapeHtml(
                                                            appointment.id
                                                        )}')"
                                                    >
                                                        حذف نوبت
                                                    </button>

                                                </div>

                                            </article>

                                            `;

                                        }
                                    )
                                    .join("")}

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================
   DATE HELPERS
========================= */

function normalizeDateForSort(date){

    if(!date){

        return 99999999;

    }


    const numbers =
        String(date)

            .replace(/۰/g,"0")
            .replace(/۱/g,"1")
            .replace(/۲/g,"2")
            .replace(/۳/g,"3")
            .replace(/۴/g,"4")
            .replace(/۵/g,"5")
            .replace(/۶/g,"6")
            .replace(/۷/g,"7")
            .replace(/۸/g,"8")
            .replace(/۹/g,"9")

            .replace(/-/g,"/")

            .split("/");


    if(numbers.length !== 3){

        return 99999999;

    }


    return (
        Number(numbers[0]) * 10000 +
        Number(numbers[1]) * 100 +
        Number(numbers[2])
    );

}


function getTodayJalaliForAdmin(){

    const formatter =
        new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        );


    const parts =
        formatter.formatToParts(
            new Date()
        );


    const year =
        parts.find(
            part =>
                part.type === "year"
        ).value;


    const month =
        parts.find(
            part =>
                part.type === "month"
        ).value;


    const day =
        parts.find(
            part =>
                part.type === "day"
        ).value;


    return (
        Number(year) * 10000 +
        Number(month) * 100 +
        Number(day)
    );

}


function getDayLabel(
    date,
    today
){

    const dateNumber =
        normalizeDateForSort(
            date
        );


    if(dateNumber === today){

        return "امروز";

    }


    if(dateNumber === today + 1){

        return "فردا";

    }


    if(dateNumber === today + 2){

        return "پس‌فردا";

    }


    return "تاریخ نوبت";

}


/* =========================
   DELETE APPOINTMENT
========================= */

async function deleteAppointment(id){

    const appointment =
        appointments.find(
            item =>
                String(item.id) === String(id)
        );


    if(!appointment){

        alert(
            "نوبت موردنظر پیدا نشد."
        );

        return;
    }


    const customerName =
        appointment.name ||
        "این مشتری";


    const confirmed =
        confirm(
            `آیا مطمئن هستید نوبت «${customerName}» حذف شود؟`
        );


    if(!confirmed){

        return;
    }


    const deleteButtons =
        document.querySelectorAll(
            ".delete-btn"
        );


    deleteButtons.forEach(
        button => {

            button.disabled = true;

        }
    );


    const {
        error
    } =
        await supabaseClient
            .from("appointments")
            .delete()
            .eq("id",id);


    if(error){

        console.error(error);


        deleteButtons.forEach(
            button => {

                button.disabled = false;

            }
        );


        alert(
            "حذف نوبت انجام نشد."
        );

        return;
    }


    appointments =
        appointments.filter(
            item =>
                String(item.id) !== String(id)
        );


    updateCounts();

    renderAppointments();

}


/* =========================
   REFRESH
========================= */

refreshBtn.addEventListener(
    "click",
    loadAppointments
);


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   PERSIAN NUMBERS
========================= */

function toPersianDigits(value){

    return String(value)

        .replace(
            /\d/g,
            digit =>
                "۰۱۲۳۴۵۶۷۸۹"[digit]
        );

}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
    function(
        event,
        session
    ){

        if(session){

            showAdmin();

        }else{

            showLogin();

        }

    }
);


checkSession();

</script>

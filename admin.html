<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>پنل مدیریت | HOBAB BEAUTY</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Vazirmatn',sans-serif;
            background:#fff8f6;
            color:#4b3035;
            min-height:100vh;
        }


        /* =========================
           LOGIN
        ========================= */

        .login-page{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        .login-box{
            width:min(400px,100%);
            background:rgba(255,255,255,.82);
            border:1px solid rgba(130,90,90,.13);
            border-radius:28px;
            padding:32px 25px;
            box-shadow:0 20px 60px rgba(90,50,50,.08);
            text-align:center;
        }

        .login-logo{
            font-size:27px;
            font-weight:700;
            letter-spacing:2px;
        }

        .login-sub{
            margin-top:5px;
            color:#9b7b81;
            font-size:13px;
        }

        .login-box input{
            width:100%;
            margin-top:14px;
            padding:14px;
            border:1px solid #e4d8d8;
            border-radius:14px;
            outline:none;
            font-family:inherit;
            background:#fff;
        }

        .login-box button{
            width:100%;
            margin-top:16px;
            padding:14px;
            border:none;
            border-radius:14px;
            background:#76535b;
            color:#fff;
            font-family:inherit;
            cursor:pointer;
        }

        .login-error{
            color:#b44e5b;
            font-size:12px;
            margin-top:12px;
            min-height:18px;
        }


        /* =========================
           ADMIN
        ========================= */

        .admin-page{
            display:none;
            min-height:100vh;
        }

        .header{
            padding:22px 18px;
            background:rgba(255,255,255,.78);
            border-bottom:1px solid rgba(130,90,90,.12);
            backdrop-filter:blur(15px);
            position:sticky;
            top:0;
            z-index:10;
        }

        .header-inner{
            width:min(1100px,94%);
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
        }

        .brand h1{
            font-size:21px;
        }

        .brand p{
            font-size:12px;
            color:#9b7b81;
            margin-top:3px;
        }

        .logout{
            border:none;
            padding:9px 14px;
            border-radius:11px;
            background:#f2e7e7;
            color:#6f4b53;
            font-family:inherit;
            cursor:pointer;
        }


        .container{
            width:min(1100px,94%);
            margin:25px auto 50px;
        }


        /* =========================
           CATEGORIES
        ========================= */

        .section-title{
            font-size:18px;
            margin-bottom:14px;
        }

        .categories{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:12px;
        }

        .category{
            border:1px solid #eadede;
            background:rgba(255,255,255,.8);
            border-radius:20px;
            padding:19px 12px;
            font-family:inherit;
            color:#5a3b42;
            cursor:pointer;
            transition:.2s;
            text-align:center;
        }

        .category:hover{
            transform:translateY(-2px);
        }

        .category.active{
            background:#76535b;
            color:#fff;
            border-color:#76535b;
            box-shadow:0 10px 25px rgba(100,65,70,.15);
        }

        .category-name{
            display:block;
            font-size:15px;
            font-weight:600;
        }

        .category-count{
            display:block;
            margin-top:6px;
            font-size:11px;
            opacity:.7;
        }


        /* =========================
           APPOINTMENTS
        ========================= */

        .appointments-panel{
            margin-top:25px;
            background:rgba(255,255,255,.8);
            border:1px solid #eadede;
            border-radius:24px;
            padding:20px;
        }

        .appointments-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            margin-bottom:17px;
        }

        .appointments-head h2{
            font-size:18px;
        }

        .refresh{
            border:none;
            background:#f2e7e7;
            color:#6f4b53;
            padding:9px 13px;
            border-radius:11px;
            font-family:inherit;
            cursor:pointer;
        }

        .appointment-list{
            display:grid;
            gap:12px;
        }

        .appointment{
            border:1px solid #eee2e2;
            border-radius:17px;
            padding:16px;
            background:#fff;
            transition:.2s;
        }

        .appointment.confirmed-card{
            border-color:#b9d7c1;
            background:linear-gradient(
                135deg,
                #ffffff 0%,
                #fbfffc 100%
            );
        }

        .appointment-top{
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:10px;
        }

        .appointment-name{
            font-weight:700;
            font-size:15px;
        }

        .appointment-time{
            background:#f5e9e9;
            color:#704b53;
            padding:6px 10px;
            border-radius:9px;
            font-size:12px;
            white-space:nowrap;
        }

        .appointment.confirmed-card .appointment-time{
            background:#e7f4ea;
            color:#356b48;
        }

        .appointment-info{
            margin-top:12px;
            display:grid;
            gap:7px;
            font-size:13px;
            color:#735d62;
        }

        .appointment-info strong{
            color:#4b3035;
        }

        .description{
            border-top:1px solid #eee4e4;
            margin-top:12px;
            padding-top:12px;
            font-size:13px;
            line-height:1.8;
            color:#755f64;
        }


        /* =========================
           CONFIRMATION STATUS
        ========================= */

        .appointment-status{
            margin-top:13px;
            padding:10px 12px;
            border-radius:11px;
            font-size:12px;
            line-height:1.8;
        }

        .appointment-status.pending{
            background:#fff8ed;
            border:1px solid #f0dfbd;
            color:#987342;
        }

        .appointment-status.confirmed{
            background:#edf8f0;
            border:1px solid #c9e3d0;
            color:#356b48;
        }

        .appointment-status strong{
            font-weight:700;
        }


        /* =========================
           ACTIONS
        ========================= */

        .appointment-actions{
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            gap:9px;
            margin-top:15px;
            padding-top:14px;
            border-top:1px solid #eee4e4;
        }

        .call-btn,
        .confirm-btn,
        .delete-btn{
            border:none;
            border-radius:11px;
            padding:11px 8px;
            font-family:inherit;
            font-size:12px;
            cursor:pointer;
            text-decoration:none;
            text-align:center;
            transition:.2s;
        }

        .call-btn{
            background:#f1e8e8;
            color:#6f4b53;
        }

        .call-btn:hover{
            background:#e9dddd;
        }

        .confirm-btn{
            background:#e8f5ec;
            color:#356b48;
        }

        .confirm-btn:hover{
            background:#dceee1;
        }

        .confirm-btn.confirmed{
            background:#dff0e3;
            color:#2f6642;
        }

        .delete-btn{
            background:#f7e5e5;
            color:#b04f5b;
        }

        .delete-btn:hover{
            background:#f0d8d8;
        }

        .delete-btn:disabled,
        .confirm-btn:disabled{
            opacity:.6;
            cursor:not-allowed;
        }


        /* =========================
           DAY GROUPS
        ========================= */

        .day-group{
            margin-bottom:24px;
        }

        .day-group:last-child{
            margin-bottom:0;
        }

        .day-group-title{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            margin-bottom:10px;
            padding:13px 15px;
            border-radius:14px;
            background:#e8f5ec;
            color:#356b48;
            font-size:14px;
            font-weight:700;
            border-right:4px solid #6fa982;
        }

        .day-group-title span{
            font-size:12px;
            font-weight:600;
            color:#4d805d;
            background:#f7fcf8;
            padding:6px 10px;
            border-radius:9px;
            border:1px solid #cfe5d5;
        }

        .day-group-list{
            display:grid;
            gap:10px;
        }


        /* =========================
           MODAL
        ========================= */

        .modal-overlay{
            position:fixed;
            inset:0;
            background:rgba(60,40,45,.38);
            backdrop-filter:blur(6px);
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
            z-index:100;
        }

        .modal-overlay.show{
            display:flex;
        }

        .confirm-modal{
            width:min(390px,100%);
            background:#fff;
            border-radius:24px;
            padding:24px;
            box-shadow:0 25px 70px rgba(50,30,35,.2);
        }

        .modal-title{
            font-size:18px;
            font-weight:700;
            color:#4b3035;
        }

        .modal-subtitle{
            margin-top:6px;
            color:#9b7b81;
            font-size:12px;
            line-height:1.8;
        }

        .modal-customer{
            margin-top:16px;
            padding:12px 13px;
            background:#faf5f4;
            border:1px solid #eee1e1;
            border-radius:13px;
            font-size:13px;
            line-height:2;
        }

        .time-label{
            display:block;
            margin-top:18px;
            margin-bottom:7px;
            font-size:13px;
            font-weight:600;
            color:#5a3b42;
        }

        .time-input{
            width:100%;
            padding:13px 14px;
            border:1px solid #dfd1d1;
            border-radius:13px;
            outline:none;
            font-family:inherit;
            font-size:15px;
            direction:ltr;
            text-align:center;
            background:#fff;
            color:#4b3035;
        }

        .time-input:focus{
            border-color:#8cae94;
            box-shadow:0 0 0 3px rgba(111,169,130,.12);
        }

        .time-hint{
            margin-top:7px;
            font-size:11px;
            color:#a48d91;
            text-align:center;
        }

        .modal-error{
            min-height:20px;
            margin-top:8px;
            color:#b44e5b;
            font-size:12px;
            text-align:center;
        }

        .modal-actions{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:9px;
            margin-top:15px;
        }

        .modal-cancel,
        .modal-confirm{
            border:none;
            border-radius:12px;
            padding:12px;
            font-family:inherit;
            cursor:pointer;
        }

        .modal-cancel{
            background:#f2e7e7;
            color:#6f4b53;
        }

        .modal-confirm{
            background:#6f9878;
            color:#fff;
        }

        .modal-confirm:disabled{
            opacity:.6;
            cursor:not-allowed;
        }


        /* =========================
           STATES
        ========================= */

        .empty{
            text-align:center;
            padding:45px 10px;
            color:#a48d91;
            font-size:13px;
        }

        .loading{
            text-align:center;
            padding:35px;
            color:#9a7c82;
            font-size:13px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:700px){

            .categories{
                grid-template-columns:repeat(2,1fr);
            }

            .appointments-panel{
                padding:15px;
            }

            .appointment-actions{
                grid-template-columns:1fr 1fr 1fr;
                gap:7px;
            }

            .call-btn,
            .confirm-btn,
            .delete-btn{
                padding:10px 5px;
                font-size:11px;
            }

            .day-group-title{
                padding:11px 12px;
            }

            .confirm-modal{
                padding:20px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<section

    id="loginPage"
>

<!-- =========================

<section

    id="adminPage"
>


<header class="header">

            </h1>

</section>



<!-- =========================
     CONFIRM MODAL
========================= -->

<div
    class="modal-overlay"
    id="confirmModal"
>

    <div class="confirm-modal">

        <div class="modal-title">
            تأیید نوبت
        </div>

        <div class="modal-subtitle">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://oeadtawmcbzblkmfqmbd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_1t6kJsgr3IwQkWptFgJ1Iw_Fj1FB4U2";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginPage =
    document.getElementById("loginPage");

const adminPage =
    document.getElementById("adminPage");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginError =
    document.getElementById("loginError");

const appointmentList =
    document.getElementById("appointmentList");

const appointmentsTitle =
    document.getElementById("appointmentsTitle");

const refreshBtn =
    document.getElementById("refreshBtn");

const categories =
    document.querySelectorAll(".category");


const confirmModal =
    document.getElementById("confirmModal");

const modalCustomer =
    document.getElementById("modalCustomer");

const confirmedTimeInput =
    document.getElementById("confirmedTime");

const modalError =
    document.getElementById("modalError");

const modalCancel =
    document.getElementById("modalCancel");

const modalConfirm =
    document.getElementById("modalConfirm");


let appointments = [];

let selectedService = "hair";

let selectedAppointment = null;


const serviceNames = {

    hair:"مو",

    makeup:"میکاپ",

    nail:"ناخن",

    lash:"مژه",

    brow:"ابرو",

    skin:"مراقبت پوست",

    bridal:"عروس"

};


/* =========================
   CHECK SESSION
========================= */

async function checkSession(){

    const {
        data:{
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if(session){

        showAdmin();

    }else{

        showLogin();

    }

}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    async function(){

        loginError.textContent = "";

        const email =
            document.getElementById("email")
                .value.trim();

        const password =
            document.getElementById("password")
                .value;


        if(!email || !password){

            loginError.textContent =
                "ایمیل و رمز عبور را وارد کنید.";

            return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "در حال ورود...";


        const {
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email:email,

                password:password

            });


        loginBtn.disabled = false;

        loginBtn.textContent =
            "ورود به پنل";


        if(error){

            loginError.textContent =
                "ایمیل یا رمز عبور اشتباه است.";

            return;
        }


        showAdmin();

    }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        appointments = [];

        showLogin();

    }
);


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

    loginPage.style.display =
        "flex";

    adminPage.style.display =
        "none";

}


/* =========================
   SHOW ADMIN
========================= */

async function showAdmin(){

    loginPage.style.display =
        "none";

    adminPage.style.display =
        "block";

    await loadAppointments();

}


/* =========================
   LOAD APPOINTMENTS
========================= */

async function loadAppointments(){

    appointmentList.innerHTML =
        `<div class="loading">
            در حال دریافت نوبت‌ها...
        </div>`;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("appointments")
            .select("*")
            .order(
                "date",
                {
                    ascending:true
                }
            )
            .order(
                "time",
                {
                    ascending:true
                }
            );


    if(error){

        console.error(error);

        appointmentList.innerHTML =
            `<div class="empty">
                دریافت نوبت‌ها انجام نشد.
            </div>`;

        return;
    }


    appointments =
        data || [];


    updateCounts();

    renderAppointments();

}


/* =========================
   COUNTS
========================= */

function updateCounts(){

    categories.forEach(
        category => {

            const service =
                category.dataset.service;


            const count =
                appointments.filter(
                    appointment =>
                        appointment.service === service
                ).length;


            const countElement =
                category.querySelector(
                    ".category-count"
                );


            countElement.textContent =
                toPersianDigits(count)
                + " نوبت";

        }
    );

}


/* =========================
   CATEGORY CLICK
========================= */

categories.forEach(
    category => {

        category.addEventListener(
            "click",
            function(){

                categories.forEach(
                    item =>
                        item.classList.remove(
                            "active"
                        )
                );


                this.classList.add(
                    "active"
                );


                selectedService =
                    this.dataset.service;


                appointmentsTitle.textContent =
                    "نوبت‌های "
                    + this.dataset.name;


                renderAppointments();

            }
        );

    }
);


/* =========================
   RENDER APPOINTMENTS
========================= */

function renderAppointments(){

    const filtered =
        appointments.filter(
            appointment =>
                appointment.service ===
                selectedService
        );


    if(!filtered.length){

        appointmentList.innerHTML =
            `<div class="empty">
                برای این بخش هنوز نوبتی ثبت نشده است.
            </div>`;

        return;
    }


    const groups = {};


    filtered.forEach(
        appointment => {

            const date =
                appointment.date || "-";


            if(!groups[date]){

                groups[date] = [];

            }


            groups[date].push(
                appointment
            );

        }
    );


    const sortedDates =
        Object.keys(groups).sort(
            (a,b) =>
                normalizeDateForSort(a) -
                normalizeDateForSort(b)
        );


    const today =
        getTodayJalaliForAdmin();


    appointmentList.innerHTML =
        sortedDates
            .map(
                date => {

                    const dayAppointments =
                        groups[date].sort(
                            (a,b) => {

                                const aConfirmed =
                                    a.confirmed_time ||
                                    "";

                                const bConfirmed =
                                    b.confirmed_time ||
                                    "";

                                return String(
                                    aConfirmed ||
                                    a.time ||
                                    ""
                                ).localeCompare(
                                    String(
                                        bConfirmed ||
                                        b.time ||
                                        ""
                                    )
                                );

                            }
                        );


                    const dayLabel =
                        getDayLabel(
                            date,
                            today
                        );


                    return `

                        <div class="day-group">

                            <div class="day-group-title">

                                <div>
                                    ${dayLabel}
                                </div>

                                <span>
                                    ${escapeHtml(
                                        date
                                    )}
                                </span>

                            </div>


                            <div class="day-group-list">

                                ${dayAppointments
                                    .map(
                                        appointment => {

                                            const phone =
                                                String(
                                                    appointment.phone || ""
                                                ).trim();


                                            const safePhone =
                                                phone.replace(
                                                    /[^0-9+]/g,
                                                    ""
                                                );


                                            const isConfirmed =
                                                appointment.confirmed === true;


                                            const confirmedTime =
                                                appointment.confirmed_time ||
                                                "";


                                            return `

                                            <article
                                                class="appointment ${isConfirmed ? "confirmed-card" : ""}"
                                                data-id="${escapeHtml(
                                                    appointment.id
                                                )}"
                                            >

                                                <div class="appointment-top">

                                                    <div class="appointment-name">
                                                        ${escapeHtml(
                                                            appointment.name || "-"
                                                        )}
                                                    </div>


                                                    <div class="appointment-time">

                                                        ${
                                                            isConfirmed &&
                                                            confirmedTime
                                                                ?
                                                                "ساعت " +
                                                                toPersianDigits(
                                                                    confirmedTime
                                                                )
                                                                :
                                                                escapeHtml(
                                                                    appointment.time === "morning"
                                                                        ? "صبح"
                                                                        : appointment.time === "afternoon"
                                                                            ? "عصر"
                                                                            : appointment.time || "-"
                                                                )
                                                        }

                                                    </div>

                                                </div>


                                                <div class="appointment-info">

                                                    <div>
                                                        <strong>
                                                            شماره تماس:
                                                        </strong>

                                                        ${escapeHtml(
                                                            appointment.phone || "-"
                                                        )}
                                                    </div>


                                                    <div>
                                                        <strong>
                                                            خدمت:
                                                        </strong>

                                                        ${escapeHtml(
                                                            serviceNames[
                                                                appointment.service
                                                            ] ||
                                                            appointment.service ||
                                                            "-"
                                                        )}
                                                    </div>

                                                </div>


                                                <div class="description">

                                                    <strong>
                                                        توضیحات:
                                                    </strong>

                                                    <br>

                                                    ${escapeHtml(
                                                        appointment.description || "-"
                                                    )}

                                                </div>


                                                ${
                                                    isConfirmed
                                                        ?
                                                        `
                                                        <div class="appointment-status confirmed">

                                                            <strong>
                                                                ✓ نوبت تأیید شده
                                                            </strong>

                                                            <br>

                                                            ساعت دقیق:
                                                            <strong>
                                                                ${toPersianDigits(
                                                                    confirmedTime || "-"
                                                                )}
                                                            </strong>

                                                        </div>
                                                        `
                                                        :
                                                        `
                                                        <div class="appointment-status pending">

                                                            نوبت در انتظار تأیید و تعیین ساعت دقیق است.

                                                        </div>
                                                        `
                                                }


                                                <div class="appointment-actions">

                                                    <a
                                                        class="call-btn"
                                                        href="tel:${escapeHtml(
                                                            safePhone
                                                        )}"
                                                    >
                                                        تماس با مشتری
                                                    </a>


                                                    <button
                                                        type="button"
                                                        class="confirm-btn ${isConfirmed ? "confirmed" : ""}"
                                                        onclick="openConfirmModal('${escapeHtml(
                                                            appointment.id
                                                        )}')"
                                                    >
                                                        ${
                                                            isConfirmed
                                                                ?
                                                                "ویرایش ساعت"
                                                                :
                                                                "تأیید نوبت"
                                                        }
                                                    </button>


                                                    <button
                                                        type="button"
                                                        class="delete-btn"
                                                        onclick="deleteAppointment('${escapeHtml(
                                                            appointment.id
                                                        )}')"
                                                    >
                                                        حذف نوبت
                                                    </button>

                                                </div>

                                            </article>

                                            `;

                                        }
                                    )
                                    .join("")}

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================
   OPEN CONFIRM MODAL
========================= */

function openConfirmModal(id){

    const appointment =
        appointments.find(
            item =>
                String(item.id) === String(id)
        );


    if(!appointment){

        alert(
            "نوبت موردنظر پیدا نشد."
        );

        return;
    }


    selectedAppointment =
        appointment;


    const service =
        serviceNames[
            appointment.service
        ] ||
        appointment.service ||
        "-";


    const period =
        appointment.time === "morning"
            ? "صبح"
            : appointment.time === "afternoon"
                ? "عصر"
                : appointment.time || "-";


    modalCustomer.innerHTML = `

        <strong>
            ${escapeHtml(
                appointment.name || "-"
            )}
        </strong>

        <br>

        تاریخ:
        ${escapeHtml(
            appointment.date || "-"
        )}

        <br>

        بازه انتخابی:
        ${escapeHtml(
            period
        )}

        <br>

        خدمت:
        ${escapeHtml(
            service
        )}

    `;


    confirmedTimeInput.value =
        appointment.confirmed_time || "";


    modalError.textContent = "";


    confirmModal.classList.add(
        "show"
    );


    setTimeout(
        function(){

            confirmedTimeInput.focus();

        },
        100
    );

}


/* =========================
   CLOSE MODAL
========================= */

function closeConfirmModal(){

    confirmModal.classList.remove(
        "show"
    );

    selectedAppointment =
        null;

    confirmedTimeInput.value =
        "";

    modalError.textContent =
        "";

}


/* =========================
   MODAL EVENTS
========================= */

modalCancel.addEventListener(
    "click",
    closeConfirmModal
);


confirmModal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            confirmModal
        ){

            closeConfirmModal();

        }

    }
);


confirmedTimeInput.addEventListener(
    "input",
    function(){

        let value =
            this.value;

        value =
            value
                .replace(
                    /[۰-۹]/g,
                    digit =>
                        "۰۱۲۳۴۵۶۷۸۹".indexOf(
                            digit
                        )
                );


        value =
            value.replace(
                /[^0-9:]/g,
                ""
            );


        this.value =
            value;

    }
);


/* =========================
   CONFIRM APPOINTMENT
========================= */

modalConfirm.addEventListener(
    "click",
    async function(){

        if(!selectedAppointment){

            return;
        }


        let time =
            confirmedTimeInput.value
                .trim();


        time =
            convertPersianDigitsToEnglish(
                time
            );


        const timePattern =
            /^([01]\d|2[0-3]):([0-5]\d)$/;


        if(!timePattern.test(time)){

            modalError.textContent =
                "ساعت را به شکل صحیح وارد کنید؛ مثلاً 10:00";

            confirmedTimeInput.focus();

            return;
        }


        modalError.textContent =
            "";


        modalConfirm.disabled =
            true;

        modalConfirm.textContent =
            "در حال ثبت...";


        const {
            error
        } =
            await supabaseClient
                .from("appointments")
                .update({

                    confirmed:true,

                    confirmed_time:time

                })
                .eq(
                    "id",
                    selectedAppointment.id
                );


        if(error){

            console.error(error);


            modalConfirm.disabled =
                false;

            modalConfirm.textContent =
                "تأیید و ثبت ساعت";


            modalError.textContent =
                "ثبت ساعت انجام نشد. دسترسی دیتابیس را بررسی کنید.";

            return;
        }


        appointments =
            appointments.map(
                appointment => {

                    if(
                        String(
                            appointment.id
                        ) ===
                        String(
                            selectedAppointment.id
                        )
                    ){

                        return {

                            ...appointment,

                            confirmed:true,

                            confirmed_time:time

                        };

                    }


                    return appointment;

                }
            );


        closeConfirmModal();

        renderAppointments();

    }
);


/* =========================
   DELETE APPOINTMENT
========================= */

async function deleteAppointment(id){

    const appointment =
        appointments.find(
            item =>
                String(item.id) === String(id)
        );


    if(!appointment){

        alert(
            "نوبت موردنظر پیدا نشد."
        );

        return;
    }


    const customerName =
        appointment.name ||
        "این مشتری";


    const confirmed =
        confirm(
            `آیا مطمئن هستید نوبت «${customerName}» حذف شود؟`
        );


    if(!confirmed){

        return;
    }


    const deleteButtons =
        document.querySelectorAll(
            ".delete-btn"
        );


    deleteButtons.forEach(
        button => {

            button.disabled = true;

        }
    );


    const {
        error
    } =
        await supabaseClient
            .from("appointments")
            .delete()
            .eq("id",id);


    if(error){

        console.error(error);


        deleteButtons.forEach(
            button => {

                button.disabled = false;

            }
        );


        alert(
            "حذف نوبت انجام نشد."
        );

        return;
    }


    appointments =
        appointments.filter(
            item =>
                String(item.id) !== String(id)
        );


    updateCounts();

    renderAppointments();

}

   REFRESH
========================= */

refreshBtn.addEventListener(

);


/* =========================
   DATE HELPERS
========================= */

function normalizeDateForSort(date){

    if(!date){

        return 99999999;

    }


    const numbers =
        String(date)

            .replace(/۰/g,"0")
            .replace(/۱/g,"1")
            .replace(/۲/g,"2")
            .replace(/۳/g,"3")
            .replace(/۴/g,"4")
            .replace(/۵/g,"5")
            .replace(/۶/g,"6")
            .replace(/۷/g,"7")
            .replace(/۸/g,"8")
            .replace(/۹/g,"9")

            .replace(/-/g,"/")

            .split("/");


    if(numbers.length !== 3){

        return 99999999;

    }


    return (
        Number(numbers[0]) * 10000 +
        Number(numbers[1]) * 100 +
        Number(numbers[2])
    );

}


function getTodayJalaliForAdmin(){

    const formatter =
        new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        );


    const parts =
        formatter.formatToParts(
            new Date()
        );


    const year =
        parts.find(
            part =>
                part.type === "year"
        ).value;


    const month =
        parts.find(
            part =>
                part.type === "month"
        ).value;


    const day =
        parts.find(
            part =>
                part.type === "day"
        ).value;


    return (
        Number(year) * 10000 +
        Number(month) * 100 +
        Number(day)
    );

}


function getDayLabel(
    date,
    today
){

    const dateNumber =
        normalizeDateForSort(
            date
        );


    if(dateNumber === today){

        return "امروز";

    }


    if(dateNumber === today + 1){

        return "فردا";

    }


    if(dateNumber === today + 2){

        return "پس‌فردا";

    }


    return "تاریخ نوبت";

}


/* =========================
   HELPERS
========================= */

function convertPersianDigitsToEnglish(value){

    return String(value)

        .replace(
            /۰/g,
            "0"
        )

        .replace(
            /۱/g,
            "1"
        )

        .replace(
            /۲/g,
            "2"
        )

        .replace(
            /۳/g,
            "3"
        )

        .replace(
            /۴/g,
            "4"
        )

        .replace(
            /۵/g,
            "5"
        )

        .replace(
            /۶/g,
            "6"
        )

        .replace(
            /۷/g,
            "7"
        )

        .replace(
            /۸/g,
            "8"
        )

        .replace(
            /۹/g,
            "9"
        );

}


function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function toPersianDigits(value){

    return String(value)

        .replace(
            /\d/g,
            digit =>
                "۰۱۲۳۴۵۶۷۸۹"[digit]
        );

}
